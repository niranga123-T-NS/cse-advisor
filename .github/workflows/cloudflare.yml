name: Publish to Cloudflare (sign-in required)

# Builds the site and deploys it to Cloudflare Pages, where Cloudflare Access lets in only invited people.
# Does nothing until these repository secrets exist: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# (setup steps in SECURITY.md). Started by "Publish site", or by hand.
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: cloudflare-publish
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}   # set the repository variable RUNNER=self-hosted to use your own free machine
    timeout-minutes: 20
    steps:
      - name: Configured?
        id: cfg
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: if [ -n "$T" ] && [ -n "$A" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "Cloudflare secrets not set - skipping."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cfg.outputs.go == '1'
        with:
          ref: main                 # newest commit, so files committed by the calling job (e.g. the Android app) are included
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.cfg.outputs.go == '1'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.cfg.outputs.go == '1'
        run: |
          pip install -r requirements.txt
          python build_site.py --no-fetch
          python tools/security_headers.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.cfg.outputs.go == '1'
        with:
          node-version: "22"
      - name: Deploy
        if: steps.cfg.outputs.go == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3.114.0 pages project create cse-advisor --production-branch main 2>/dev/null || true
          npx --yes wrangler@3.114.0 pages deploy site --project-name cse-advisor --branch main --commit-dirty=true
