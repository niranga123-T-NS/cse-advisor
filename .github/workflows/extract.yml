name: Extract report pages for Claude

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Stocks (space-separated)"
        required: true

permissions:
  contents: write

concurrency:
  group: extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y -qq poppler-utils > /dev/null
      - run: pip install -r requirements.txt
      - env:
          SYMBOLS: ${{ github.event.inputs.symbols }}
        run: |
          git config user.name "cse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python extract.py $SYMBOLS
