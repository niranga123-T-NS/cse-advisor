name: Extract report pages for Claude

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Stocks (space-separated); start with --gaps to extract only the EPS rows of quarterly reports read without EPS"
        required: true

permissions:
  contents: write

concurrency:
  group: extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y -qq poppler-utils tesseract-ocr > /dev/null
      - run: pip install -r requirements.txt
      - env:
          SYMBOLS: ${{ github.event.inputs.symbols }}
        run: |
          git config user.name "cse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python extract.py $SYMBOLS
