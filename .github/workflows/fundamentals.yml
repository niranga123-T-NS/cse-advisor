name: Read company reports

on:
  schedule:
    - cron: "0 20 * * *"   # 01:30 Colombo time, nightly; only new reports are read
  workflow_dispatch:
    inputs:
      symbols:
        description: "Only these stocks (space-separated), blank = all"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cse-update
  cancel-in-progress: false

jobs:
  reports:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}   # set the repository variable RUNNER=self-hosted to use your own free machine
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]   # 4 parallel jobs, each reads a quarter of the companies
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: command -v pdftoppm >/dev/null || sudo apt-get install -y -qq poppler-utils > /dev/null
      - run: pip install -r requirements.txt
      - name: Read quarterly and annual reports
        env:
          AUTOCOMMIT: "1"
          FUND_BUDGET_MIN: "300"
          SHARD: "${{ matrix.shard }}/4"
          SYMBOLS: ${{ github.event.inputs.symbols }}
        run: |
          git config user.name "cse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python fundamentals.py $SYMBOLS
      - name: Save figures
        run: |
          git add data/fundamentals
          git diff --cached --quiet || git commit -m "Report figures $(date -u +%F) part ${{ matrix.shard }}"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; sleep 7; done

  publish:
    needs: reports
    if: always()
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}   # set the repository variable RUNNER=self-hosted to use your own free machine
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sector for any new listing
        run: |
          python sectors.py
          git config user.name "cse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sectors.csv
          git diff --cached --quiet || (git commit -m "Sector map" && git pull --rebase -X theirs origin main && git push) || true
      - run: python build_site.py --no-fetch
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        continue-on-error: true   # GitHub Pages stops when the repository is private
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        continue-on-error: true   # GitHub Pages stops when the repository is private
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        continue-on-error: true   # GitHub Pages stops when the repository is private

  cloudflare:
    needs: publish
    if: ${{ !cancelled() }}     # still runs when GitHub Pages is switched off
    uses: ./.github/workflows/cloudflare.yml
    secrets: inherit
