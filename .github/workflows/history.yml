name: Long price history

# CSE serves one year of prices. This downloads 10-20 years of daily prices for every counter from Yahoo Finance
# (unofficial; cleaned and checked later by longterm.py) and one year of official daily ASPI from CSE.
# Run by hand: Actions -> Long price history -> Run workflow. Takes about 10 minutes.
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Only these symbols (blank = all), e.g. JKH.N0000 COMB.N0000"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}   # set the repository variable RUNNER=self-hosted to use your own free machine
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -q -c requirements.txt requests pandas numpy
      - env:
          SYMBOLS: ${{ inputs.symbols }}
        run: python longhist.py fetch $SYMBOLS   # word-split on purpose: a list of symbols
      - run: python longhist.py aspi
      - name: Save
        run: |
          git config user.name "cse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/long data/index
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "Long price history $(TZ=Asia/Colombo date +%F)"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep 5; done
