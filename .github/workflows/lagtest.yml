name: Lag test (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  lag:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests pandas numpy
      - run: |
          git config user.name "cse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LIVE_TEST_TICKS=14 python live.py --test > live.log 2>&1 &
          sleep 20
          python tools/lagtest.py
          wait
          echo "---- live.log"; cat live.log
