name: Interest rates and the rupee

# T-bill auction results from the Public Debt Management Office (treasury.gov.lk) and USD/LKR from Yahoo Finance.
# The daily "Update CSE data" job also does this; this one is for running it by hand or on a Saturday.
on:
  schedule:
    - cron: "17 2 * * 6"          # Saturday 07:47 Colombo
  workflow_dispatch:
    inputs:
      mode:
        description: "fetch, or probe (save what the site serves)"
        required: false
        default: "fetch"

permissions:
  contents: write

concurrency:
  group: macro
  cancel-in-progress: false

jobs:
  macro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pypdf
      - name: Collect
        run: |
          M="${{ inputs.mode }}"
          if [ "$M" = "probe" ]; then python macro.py probe; else python macro.py fetch; fi
      - name: Save
        run: |
          git config user.name "cse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/macro
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "Rates and rupee $(TZ=Asia/Colombo date +%F)"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep 5; done
