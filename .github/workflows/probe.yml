name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: pip install -q -r requirements.txt pypdf
      - run: python tools/probe_reports.py
