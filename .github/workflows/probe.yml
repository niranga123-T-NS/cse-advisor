name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3; do
            curl -s -o /tmp/r.json -D /tmp/h "https://raw.githubusercontent.com/niranga123-T-NS/cse-advisor/live/live.json?t=$(date +%s%N)" -H "Origin: https://niranga123-t-ns.github.io"
            echo "fetch $i at $(date -u +%T): $(head -c 60 /tmp/r.json)"
            grep -iE "^(cache-control|age|access-control-allow-origin|x-cache|etag):" /tmp/h
            sleep 65
          done
