name: Probe (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests pandas
      - run: python tools/probe2.py
      - run: |
          python sectors.py
          git config user.name "cse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sectors.csv
          git diff --cached --quiet || git commit -m "Sector map"
          git pull --rebase -X theirs origin main || true
          git push
