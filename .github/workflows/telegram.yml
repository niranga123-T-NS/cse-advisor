name: Telegram summary

# Sends the morning summary to Telegram before the open (Monday to Friday). The closing summary is sent by
# "Update CSE data" straight after the daily build. Needs the secret TELEGRAM_TOKEN (see telegram.py).
on:
  schedule:
    - cron: "13 3 * * 1-5"         # 08:43 Colombo
  workflow_dispatch:
    inputs:
      message:
        description: "test, morning or close"
        required: false
        default: "test"

permissions:
  contents: read

jobs:
  send:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}   # set the repository variable RUNNER=self-hosted to use your own free machine
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -q -c requirements.txt requests
      - env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          MESSAGE: ${{ inputs.message || 'morning' }}
        run: python telegram.py "$MESSAGE"
