name: Update CSE data

on:
  schedule:
    - cron: "15 9 * * 1-5"   # 14:45 Colombo time (09:15 UTC), Mon-Fri, after the 14:30 close
  workflow_dispatch:
    inputs:
      symbols:
        description: "Stocks to add (space-separated, e.g. JKH.N0000 COMB.N0000)"
        required: false
        default: ""
      backfill_all:
        description: "Reload full history for every listed stock (takes ~10-15 min)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cse-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch CSE data and build site
        env:
          SYMBOLS: ${{ github.event.inputs.symbols }}
          BACKFILL_ALL: ${{ github.event.inputs.backfill_all }}
        run: |
          ARGS=""
          if [ -n "$SYMBOLS" ]; then ARGS="--backfill $SYMBOLS"; fi
          if [ "$BACKFILL_ALL" = "true" ]; then ARGS="$ARGS --backfill-all"; fi
          python build_site.py $ARGS

      - name: Save data to the repo
        run: |
          git config user.name "cse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data watchlist.txt
          git diff --cached --quiet || git commit -m "CSE data $(date -u +%F)"
          git pull --rebase -X theirs origin main || true
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
