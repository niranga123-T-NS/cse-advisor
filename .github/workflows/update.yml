name: Update CSE data

on:
  schedule:
    # Normally started by the "Live prices" job the moment the market closes. This schedule is only a fallback
    # (GitHub's scheduler can be hours late; the saved bar is dated by the trades, not by the clock).
    - cron: "15 9 * * 1-5"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Stocks to add (space-separated, e.g. JKH.N0000 COMB.N0000)"
        required: false
        default: ""
      backfill_all:
        description: "Reload full history for every listed stock (takes ~10-15 min)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cse-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}   # set the repository variable RUNNER=self-hosted to use your own free machine
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Interest rates and the rupee
        continue-on-error: true
        run: python macro.py fetch

      - name: Fetch CSE data and build site
        env:
          SYMBOLS: ${{ github.event.inputs.symbols }}
          BACKFILL_ALL: ${{ github.event.inputs.backfill_all }}
        run: |
          ARGS=""
          if [ -n "$SYMBOLS" ]; then ARGS="--backfill $SYMBOLS"; fi
          if [ "$BACKFILL_ALL" = "true" ]; then ARGS="$ARGS --backfill-all"; fi
          python build_site.py $ARGS

      - name: Save data to the repo
        run: |
          git config user.name "cse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data watchlist.txt
          git diff --cached --quiet || git commit -m "CSE data $(date -u +%F)"
          git pull --rebase -X theirs origin main || true
          git push

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

        continue-on-error: true   # GitHub Pages stops when the repository is private
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        continue-on-error: true   # GitHub Pages stops when the repository is private
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        continue-on-error: true   # GitHub Pages stops when the repository is private

      - name: Closing summary to Telegram
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.symbols == ''
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python telegram.py close

  cloudflare:
    needs: update
    if: ${{ !cancelled() }}     # still runs when GitHub Pages is switched off
    uses: ./.github/workflows/cloudflare.yml
    secrets: inherit
