// CSE Advisor for Android: a Trusted Web Activity, i.e. the signed-in website shown full screen in Chrome's
// engine. No data or keys are stored in the app; sign-in and access are handled by Cloudflare Access.
plugins {
    id 'com.android.application'
}

def host = System.getenv("TWA_HOST") ?: "cse-advisor.pages.dev"
def statements = '[{\\"relation\\": [\\"delegate_permission/common.handle_all_urls\\"], \\"target\\": {\\"namespace\\": \\"web\\", \\"site\\": \\"https://' + host + '\\"}}]'

android {
    namespace 'lk.cseadvisor.app'
    compileSdk 34

    defaultConfig {
        applicationId 'lk.cseadvisor.app'
        minSdk 23
        targetSdk 34
        versionCode((System.getenv("VERSION_CODE") ?: "1") as int)
        versionName "1." + (System.getenv("VERSION_CODE") ?: "0")
        manifestPlaceholders = [hostName: host, launchUrl: "https://" + host + "/"]
        resValue "string", "asset_statements", statements
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "missing.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias "cseadvisor"
            keyPassword System.getenv("KEYSTORE_PASSWORD")
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
