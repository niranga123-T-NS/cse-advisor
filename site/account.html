<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c111b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Account, CSE Advisor</title>
<link rel="stylesheet" href="app.css">
<style>
  .acc { max-width:420px; } .acc label { display:block; font-size:14px; margin:12px 0 4px; color:var(--ink-2); }
  .acc input { width:100%; box-sizing:border-box; font-size:16px; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); }
  .acc button { margin-top:14px; font-size:15px; padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); }
  .acc button.primary { background:var(--sapphire); color:#fff; border:0; font-weight:600; }
  #msg { min-height:1.4em; margin-top:10px; font-size:14px; }
</style>
</head>
<body>
<div class="wrap acc" id="page">
  <p><a href="./">‹ Back to the app</a></p>
  <h2>Your account</h2>
  <p>Signed in as <b id="me">…</b></p>
  <h3>Change password</h3>
  <form id="pw" autocomplete="off">
    <label for="p1">New password (10 characters or more)</label>
    <input id="p1" type="password" autocomplete="new-password" minlength="10" required>
    <label for="p2">Type it again</label>
    <input id="p2" type="password" autocomplete="new-password" minlength="10" required>
    <button class="primary" type="submit">Change password</button>
  </form>
  <div id="msg" role="status"></div>
  <h3 style="margin-top:28px">Sign out</h3>
  <p class="small mute">Signs this device out. You will need your password to come back.</p>
  <button id="out">Sign out</button>
</div>
<script src="account.js"></script>
</body>
</html>
