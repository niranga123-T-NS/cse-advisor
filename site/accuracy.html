<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c111b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CSE Advisor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Accuracy, CSE Advisor</title>
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="app.css">
<style>
  .points { margin:12px 0 0; padding-left:20px; max-width:86ch; } .points li { margin-bottom:8px; }
  .ci { font-size:12.5px; }
  @media (max-width:640px) { th { vertical-align:bottom; } .ci { display:block; font-size:11px; white-space:nowrap; } }
  @media (max-width:350px) { .ci { white-space:normal; } }
</style>
</head>
<body class="app" data-page="accuracy" data-title="Accuracy">
<script src="app.js"></script>
<main class="page" id="main"><p class="mute">Loading…</p></main>
<script>
const App = window.CSEApp, esc = App.esc;
const p2 = v => v == null ? '–' : (+v).toFixed(2);
const ym = d => { const m = /^(\d{4})-(\d\d)$/.exec(d || ''); return m ? `${MON[m[2] - 1]} ${m[1]}` : esc(d || ''); };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dmy = d => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(d || ''); return m ? `${+m[3]} ${MON[m[2] - 1]} ${m[1]}` : esc(d || ''); };
const sg = v => v == null ? '–' : `<span class="${v > 0 ? 'ok' : v < 0 ? 'fail' : ''}">${v > 0 ? '+' : ''}${p2(v)}%</span>`;
const ci = a => a && a[0] === a[0] ? `<span class="mute ci">(${a[0]} to ${a[1]})</span>` : '';

// ---------- Buy / Sell / Hold ratings: what each grade went on to do ----------
let RT = null, gradeHz = '60';
const GRADE = [['STRONG BUY', 'Strong buy', 'up'], ['BUY', 'Buy', 'up'], ['HOLD', 'Hold', ''], ['SELL', 'Sell', 'down'], ['STRONG SELL', 'Strong sell', 'down'], ['ALL', 'All rated shares', 'mute']];
const sgn = (v, n = 1) => v == null ? '–' : `<span class="${v > 0 ? 'ok' : v < 0 ? 'fail' : ''}">${v > 0 ? '+' : ''}${(+v).toFixed(n)}%</span>`;
function drawGrades() {
  const el = document.getElementById('gradeTable'); if (!el || !RT) return;
  const H = RT.horizons[gradeHz];
  document.querySelectorAll('[data-hz]').forEach(b => b.classList.toggle('on', b.dataset.hz === gradeHz));
  el.innerHTML = `<div class="tw"><table><tr><th>Price-only rating</th><th class="num x">Cases</th><th class="num">Gained after costs</th><th class="num">Typical result</th><th class="num xs">Middle half of results</th>
      <th class="num">Against the average share</th><th class="num x">Fell 10% or more</th></tr>
    ${GRADE.filter(g => H.grades[g[0]]).map(([k, name, cls]) => { const x = H.grades[k]; return `<tr><td class="${cls}">${k === 'ALL' ? name : '<b>' + name + '</b>'}</td><td class="num x">${x.n.toLocaleString()}</td><td class="num"><b>${x.hit}%</b></td>
      <td class="num">${sgn(x.median)}</td><td class="num xs">${sgn(x.p25)} to ${sgn(x.p75)}</td><td class="num">${k === 'ALL' ? '–' : sgn(x.excess, 2).replace('%', ' pts')}</td><td class="num x">${x.down10}%</td></tr>`; }).join('')}</table></div>
    <p class="note">Held for ${H.label}, bought at the next day's close, after ${RT.cost_pct}% for buying and selling. "Typical" is the middle result; "against the average share" is the average result less that of all rated shares over the same days.
      Buy grades did better than Sell grades in <b>${H.buy_beat_sell[0]} of ${H.buy_beat_sell[1]} years</b>; the gap between them averaged ${H.periods['2010 to 2019']} points in 2010 to 2019 and ${H.periods['2020 to now']} since 2020.</p>
    <details style="margin-top:8px"><summary>Year by year, ${H.label}</summary><div class="tw" style="margin-top:8px"><table><tr><th>Year</th><th class="num">Buy grades against the average</th><th class="num">Sell grades against the average</th>
      <th class="num">Buy grades gained</th><th class="num x">All gained</th><th class="num">Sell grades gained</th></tr>
      ${H.years.map(y => `<tr><td>${y.y}</td><td class="num">${sgn(y.buy).replace('%', ' pts')}</td><td class="num">${sgn(y.sell).replace('%', ' pts')}</td><td class="num">${y.buy_hit}%</td><td class="num x">${y.all_hit}%</td><td class="num">${y.sell_hit}%</td></tr>`).join('')}</table></div></details>`;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-hz]'); if (b) { gradeHz = b.dataset.hz; drawGrades(); } });
function combinedHtml(R) {
  const C = R.combined; if (!C) return '';
  const rows = Object.values(C.horizons).map(H => `<tr><td>${H.label}</td><td class="num"><b>${H.both_gap} pts</b></td><td class="num">${H.price_gap} pts</td>
      <td class="num">${H.both['STRONG BUY'].hit}% <span class="small x">vs ${H.price['STRONG BUY'].hit}%</span></td><td class="num">${H.both['STRONG SELL'].hit}% <span class="small x">vs ${H.price['STRONG SELL'].hit}%</span></td></tr>`).join('');
  const h = C.horizons['60'], better = Object.keys(h.both_halves).filter(k => h.both_halves[k] > h.price_halves[k] + 0.05).length, n = Object.keys(h.both_halves).length;
  return `<h2 id="figures">Adding company figures <span class="mute">tested from ${C.from.slice(0, 4)}</span></h2>
    <p class="say">Interim reports are on record, dated by the day each appeared on cse.lk, from about the start of ${C.from.slice(0, 4)}. Using only figures that were public at the time, cheaper shares (on earnings and on net assets) and more profitable ones went on to do better than average.
      Adding them to the price measures widened the gap between Buy and Sell grades, and the rating shown on this site now includes them.</p>
    <div class="tw"><table><tr><th>Held for</th><th class="num">Buy grades less Sell grades, with figures</th><th class="num">Price only</th><th class="num">Strong buy gained after costs</th><th class="num">Strong sell gained</th></tr>${rows}</table></div>
    <p class="note">Gap: the average result of shares rated Buy or Strong buy less that of Sell or Strong sell, each against the average rated share. "vs" is the price-only figure over the same weeks.
      Over three months the version with figures did better in ${better} of ${n} half-years and no worse in the rest. About ${C.with_figures} rated shares a week had usable figures.
      <b>This is under three years, most of it a rising market that favoured cheap shares,</b> so treat it as encouraging, not proven.</p>`;
}
function ratingsSection() {
  const R = RT; if (!R) return '';
  const h3 = R.horizons['60'], h12 = R.horizons['250'], sb = k => h3.grades[k] || {}, old = h3.old;
  const cmp = old && old['STRONG BUY'] && old['STRONG SELL'] ? `<h2>Against the rules used before</h2>
    <div class="tw"><table><tr><th>Held 3 months</th><th class="num">Strong buy gained after costs</th><th class="num">Strong sell gained</th><th class="num">Gap between them against the average share</th></tr>
      <tr><td><b>New ratings</b></td><td class="num">${sb('STRONG BUY').hit}%</td><td class="num">${sb('STRONG SELL').hit}%</td><td class="num"><b>${(sb('STRONG BUY').excess - sb('STRONG SELL').excess).toFixed(1)} pts</b></td></tr>
      <tr><td>Earlier chart rules</td><td class="num">${old['STRONG BUY'].hit}%</td><td class="num">${old['STRONG SELL'].hit}%</td><td class="num">${(old['STRONG BUY'].excess - old['STRONG SELL'].excess).toFixed(1)} pts</td></tr></table></div>
    <p class="note">Both measured on the same shares and the same days. The earlier rules (price above its averages, MACD, RSI, Bollinger bands, Fibonacci levels) pointed the right way, but less sharply.
      One of them was backwards for this market: a high RSI was scored as "overbought", yet shares with a high RSI went on to do better than average, not worse.</p>` : '';
  return `<section id="ratings">
    <p class="stamp">Buy, Sell and Hold ratings: ${R.cases.toLocaleString()} weekly readings from 2010 to ${h3.to.slice(0, 4)}; ${R.rated_now} of ${R.shares_now} shares rated today</p>
    <h1 class="headline" style="max-width:30ch">A rating tilts the odds. It does not settle them.</h1>
    <p class="say">On the five price measures alone, which can be tested back to 2010, shares rated Buy or Strong buy went on to beat shares rated Sell or Strong sell in ${h3.buy_beat_sell[0]} of ${h3.buy_beat_sell[1]} years over three months, and in ${h12.buy_beat_sell[0]} of ${h12.buy_beat_sell[1]} over twelve.
      But the margin is modest: held for three months, a Strong buy gained after costs ${sb('STRONG BUY').hit}% of the time and a Strong sell ${sb('STRONG SELL').hit}%.
      Held for twelve months it was ${h12.grades['STRONG BUY'].hit}% against ${h12.grades['STRONG SELL'].hit}%. Which year you bought in has mattered more than the grade.</p>
    <div class="chips" style="margin-top:14px">${Object.entries(R.horizons).map(([k, H]) => `<button class="chip" data-hz="${k}">${H.label}</button>`).join('')}</div>
    <div id="gradeTable" style="margin-top:10px"></div>
    ${cmp}
    ${combinedHtml(R)}
    <h2>How a share is rated</h2>
    <ul class="points">
      <li><b>Who is rated.</b> Shares that have ${esc(R.rule)}. In the test the measures told far less about thinly traded shares (their chance of a gain was the same whatever the grade), so those are marked "Not rated" instead of being guessed at.</li>
      ${Object.values(R.groups).map(g => `<li><b>${esc(g.title)}:</b> ${esc(g.what)}.</li>`).join('')}
      <li><b>Adding up.</b> On each of the five, a share is placed against the other rated shares that day, and the five places are added with equal weight. The top 10% are Strong buy, the next 20% Buy, the middle 40% Hold, the next 20% Sell and the bottom 10% Strong sell.</li>
      <li><b>Company figures.</b> From the latest interim report as published on cse.lk (no older than about six months): earnings for a year at the reported pace against the price, net assets against the price, return on equity, and profit growth on a year earlier. Reports whose figures failed this site's checks are left out, and per-share figures are put onto today's share basis after a split. On each figure a share is placed against the other rated shares; the average of those places is added with the same weight as the five price measures together. A share with fewer than two usable figures counts as average.</li>
    </ul>
    <h2>What was tried and did not help</h2>
    <ul class="points">
      <li><b>Fitted weights and a tree model.</b> Weights learnt from earlier years, and a gradient-boosted tree model on all the measures, did no better on later years than simply adding the five places. The simple sum is used because it has nothing to over-tune.</li>
      <li><b>The market's own state.</b> Whether the index was above or below its 200-day average, rising or falling, or how many shares were in an uptrend made no useful difference to what the ratings went on to do.</li>
      <li><b>One month.</b> Over one month no grade gained after costs even half the time. The ratings are a guide for holding periods of three months or more, not for quick trades.</li>
    </ul>
    <h2>Limits of this test</h2>
    <ul class="points">
      <li><b>The measures were chosen after looking at this same history.</b> No weights are fitted, but the choice of what to measure was informed by the past, so the future margin is probably smaller than the past one. It has already narrowed since 2020.</li>
      <li><b>Only companies still listed today are in the history.</b> Those that failed or left are missing, which flatters every figure for "gained after costs", for all grades alike.</li>
      <li><b>Prices before the last year come from Yahoo Finance,</b> an unofficial source, cleaned and checked as described on <a href="market.html">Market history</a>. Dividends are not counted.</li>
      <li><b>Past results do not predict future ones,</b> and nothing here is financial advice.</li>
    </ul>
  </section>`;
}

fetch('data/accuracy.json').then(r => r.json()).then(A => {
  const v = A.validation, tr = A.track || {}, td = A.today;
  RT = A.ratings; const ratingsHtml = ratingsSection();
  if (!v) { document.getElementById('main').innerHTML = ratingsHtml + '<p class="mute">The pattern forecast has not been tested yet. It is tested after each trading day.</p>'; drawGrades(); return; }
  App.setStatus('Tested ' + App.when(v.made));
  const t5 = v.top['5'], all = v.all, lift = v.lift_top5;
  const verdict = {
    none: ['The pattern forecast cannot yet predict short-term gains well enough to trade on.', `On days it had never seen, its best picks
           gained after costs only ${t5.hit}% of the time and lost ${p2(-t5.avg_net)}% per trade on average.`],
    possible: ['The pattern forecast shows a small gain after costs, but it is not proven.', 'The range of likely results still includes a loss.'],
    edge: ['The pattern forecast shows a measurable gain after costs on unseen days.', 'Keep watching the live record below before relying on it.']
  }[v.verdict] || ['', ''];
  const rowT = (label, s) => s && s.n ? `<tr><td>${label}</td><td class="num">${s.n.toLocaleString()}</td><td class="num"><b>${s.hit}%</b> ${ci(s.hit_ci)}</td>
      <td class="num">${sg(s.avg_net)} ${ci(s.avg_ci)}</td><td class="num x">${sg(s.median_net)}</td><td class="num x">${s.gross_up}%</td></tr>` : '';
  const liveRec = tr.forecast_days ? `
      <div class="tw"><table><tr><th>Group</th><th class="num">Forecasts</th><th class="num">Gained after costs</th><th class="num">Average result</th><th class="num x">Median</th><th class="num x">Price rose at all</th></tr>
        ${rowT('Top pick each day', tr.top['1'])}${rowT('Top 5 each day', tr.top['5'])}${rowT('Top 10 each day', tr.top['10'])}${rowT('Every forecast', tr.all)}</table></div>
      ${(tr.recent || []).length ? `<h2>Most recent top-5 forecasts that have finished</h2><div class="tw"><table><tr><th>Forecast date</th><th>Share</th><th class="num">Rank</th><th class="num">Result after costs</th></tr>
        ${tr.recent.slice().reverse().map(r => `<tr><td>${dmy(r.date)}</td><td><a href="./#${encodeURIComponent(r.symbol)}">${esc(r.symbol)}</a></td><td class="num">${r.rank}</td><td class="num">${sg(r.net)}</td></tr>`).join('')}</table></div>` : ''}`
    : `<p class="say">No published forecast has finished its ${v.holding_days} trading days yet. Every day's forecast is saved, and once its ${v.holding_days} days are up
       it is scored here against what the price actually did. This record cannot be adjusted after the fact, so it is the fairest measure of accuracy.</p>`;
  // quiet buying / selling: what followed the daily pressure readings
  const P = A.pressure && A.pressure.horizons && A.pressure.horizons['20'];
  const PN = { acc: 'Quiet buying <span class="mute">(possible hidden accumulation)</span>', dist: 'Quiet selling <span class="mute">(possible hidden distribution)</span>',
               buy: 'Buying pressure, price rising', sell: 'Selling pressure, price falling' };
  const said = r => !r || !r.edge_ci ? 'too few cases to say' : r.edge_ci[0] > 0 ? `better than average by ${p2(r.edge)} points` : r.edge_ci[1] < 0 ? `worse than average by ${p2(-r.edge)} points` : 'no measurable difference from average';
  const pressure = P ? `
    <h2 id="pressure">Quiet buying and selling <span class="mute">what followed the daily pressure readings</span></h2>
    <p class="note" style="margin:-4px 0 12px">Each share's page reads 20 days of prices and volumes for signs of quiet buying or selling. This is what happened in the 20 trading days after each reading,
      ${dmy(P.period[0])} to ${dmy(P.period[1])}, for tradeable shares, with the same trade and costs as above.</p>
    <div class="tw"><table><tr><th>Reading</th><th class="num x">Cases</th><th class="num">Average result</th><th class="num">Against all shares</th><th class="num">Gained after costs</th></tr>
      ${['acc', 'dist', 'buy', 'sell'].filter(k => P[k]).map(k => `<tr><td>${PN[k]}</td><td class="num x">${P[k].n.toLocaleString()}</td><td class="num">${sg(P[k].avg)}</td>
        <td class="num">${sg(P[k].edge)} ${ci(P[k].edge_ci)}</td><td class="num">${P[k].gain}%</td></tr>`).join('')}
      <tr><td>All tradeable shares</td><td class="num x">${P.all.n.toLocaleString()}</td><td class="num">${sg(P.all.avg)}</td><td class="num">–</td><td class="num">${P.all.gain}%</td></tr></table></div>
    <ul class="points">
      <li><b>Quiet buying:</b> ${said(P.acc)}. On this market it has not been a reason to buy.</li>
      <li><b>Quiet selling:</b> ${said(P.dist)}.${P.dist && P.dist.edge_ci && P.dist.edge_ci[1] < 0 ? ' It has worked as a caution sign.' : ''}</li>
      <li><b>Heavy selling with a falling price:</b> ${said(P.sell)}${P.sell && P.sell.edge_ci && P.sell.edge_ci[0] > 0 ? `, a rebound, but the average result (${sg(P.sell.avg)}) still did not cover the ${v.cost_pct}% cost` : ''}.</li>
      <li><b>Signs of hidden orders during the day</b> (the Big orders panel) are new and have no record yet. Every sign is saved with the day's trades so it can be scored the same way after a few weeks.</li>
    </ul>` : '';
  document.getElementById('main').innerHTML = ratingsHtml + `
    <h2 style="margin-top:46px;font-size:22px">The 5-day pattern forecast</h2>
    <p class="stamp">The verdict <span class="pill ${v.verdict === 'edge' ? 'up' : v.verdict === 'none' ? 'down' : ''}">${{ none:'not good enough to trade on', possible:'not proven', edge:'a measurable edge' }[v.verdict] || ''}</span></p>
    <h3 class="headline" style="max-width:30ch;font-size:24px">${verdict[0]}</h3>
    <p class="say">${verdict[1]}</p>

    <h2>The test in numbers <span class="mute">${dmy(v.period[0])} to ${dmy(v.period[1])}, ${all.days} trading days never seen in training</span></h2>
    <div class="stats" style="margin-top:0">
      <div class="stat"><b>${t5.hit}%</b><span>of the top 5 picks each day gained after costs (likely range ${t5.hit_ci[0]} to ${t5.hit_ci[1]}%)</span></div>
      <div class="stat"><b>${all.hit}%</b><span>of all tradeable shares gained after costs (likely range ${all.hit_ci[0]} to ${all.hit_ci[1]}%)</span></div>
      <div class="stat"><b class="${t5.avg_net >= 0 ? 'up' : 'down'}">${t5.avg_net > 0 ? '+' : ''}${p2(t5.avg_net)}%</b><span>average result per trade, top 5 picks (likely range ${p2(t5.avg_ci[0])} to ${p2(t5.avg_ci[1])}%)</span></div>
      <div class="stat"><b class="${all.avg_net >= 0 ? 'up' : 'down'}">${all.avg_net > 0 ? '+' : ''}${p2(all.avg_net)}%</b><span>average result per trade, any share; ${v.cost_pct}% of it is trading cost</span></div>
    </div>
    <p class="say" style="margin-top:14px">Picking by pattern raised the chance of a gain by ${lift.hit_pts} points (likely range ${lift.hit_ci[0]} to ${lift.hit_ci[1]}),
      but changed the average result by only ${lift.net_pts > 0 ? '+' : ''}${p2(lift.net_pts)} points (${p2(lift.net_ci[0])} to ${p2(lift.net_ci[1])}).
      In plain words: the model finds shares that move more, not shares that earn more.</p>

    <h2>What exactly is tested</h2>
    <ul class="points">
      <li><b>The trade:</b> a forecast is made after the close. You buy at the next day's close and sell at the close ${v.holding_days} trading days later.</li>
      <li><b>Costs:</b> ${v.cost_pct}% is taken off every trade (about 1.12% to buy and 1.12% to sell on the CSE). A trade "gained" only if it was up after that.</li>
      <li><b>Shares included:</b> ${esc(v.universe)}, traded on nearly every day. Thinner shares are left out because you could not really buy and sell them at the quoted prices.</li>
      <li><b>No peeking:</b> for every test day the model is rebuilt using only earlier days whose results were already known (a walk-forward test). Company-report figures are not model inputs, because today's figures were not known on past dates.</li>
      <li><b>The model:</b> gradient-boosted trees on ${v.features} pattern measures from daily prices and volumes: momentum, trend, volatility, position in recent ranges, volume, and strength against the market and against sector peers.</li>
      <li><b>Likely ranges</b> are 95% intervals from re-sampling whole days, because shares picked on the same day rise and fall together.</li>
    </ul>

    <h2>By how highly the model ranked the share</h2>
    <div class="tw"><table><tr><th>Group</th><th class="num">Trades</th><th class="num">Gained after costs</th><th class="num">Average result</th><th class="num x">Median</th><th class="num x">Price rose at all</th></tr>
      ${rowT('Top pick each day', v.top['1'])}${rowT('Top 3 each day', v.top['3'])}${rowT('Top 5 each day', v.top['5'])}${rowT('Top 10 each day', v.top['10'])}
      ${rowT('Bottom 5 each day', v.bottom5)}${rowT('Every tradeable share', v.all)}</table></div>

    <h2>Month by month <span class="mute">the market's direction matters far more than the pattern</span></h2>
    <div class="tw"><table><tr><th>Month</th><th class="num">Top 5: gained after costs</th><th class="num">Top 5: average result</th><th class="num">Any share: gained</th><th class="num">Any share: average</th></tr>
      ${v.monthly_top5.map(m => { const a = v.monthly_all.find(x => x.month === m.month) || {}; return `<tr><td>${ym(m.month)}</td><td class="num">${m.hit}%</td><td class="num">${sg(m.avg_net)}</td><td class="num">${a.hit ?? '–'}%</td><td class="num">${sg(a.avg_net)}</td></tr>`; }).join('')}</table></div>

    <h2>Live record <span class="mute">forecasts published on this site, scored after the fact</span></h2>
    ${liveRec}

    ${td ? `<h2>Highest pattern ranks from ${dmy(td.date)} <span class="mute">shown for transparency, not as picks</span></h2>
    <div class="tw"><table><tr><th>Rank</th><th>Share</th><th class="num">Chance of a gain after costs</th><th class="num">Model's expected result</th></tr>
      ${td.top.map(r => `<tr><td>${r.rank}</td><td><a href="./#${encodeURIComponent(r.symbol)}">${esc(r.symbol)}</a> <span class="mute">${esc((r.name || '').slice(0, 32))}</span></td><td class="num">${r.hit != null ? 'about ' + r.hit + '%' : '–'}</td><td class="num">${sg(r.exp)}</td></tr>`).join('')}</table></div>` : ''}

    ${pressure}

    <h2>Why the accuracy is not higher, and what could raise it</h2>
    <ul class="points">
      <li><b>Costs are the main hurdle.</b> A share must rise more than ${v.cost_pct}% in ${v.holding_days} days just to break even. In this test period only about one share in five did.</li>
      <li><b>The model has learnt from one year of daily prices,</b> the year CSE's own site provides. A model needs several years, covering rising and falling markets, to learn patterns that last.
        This site now also holds 10 to 20 years of older prices from an unofficial source (see <a href="market.html">Market history</a>); the model has not been retrained and re-tested on them yet.</li>
      <li><b>There is no intraday history yet.</b> During market hours the site saves every share's price and volume every 15 seconds, plus order-book totals. After some weeks there will be enough to test intraday patterns the same strict way.</li>
      <li><b>No model predicts share prices with very high accuracy.</b> Prices already reflect what is publicly known. Any tool that claims otherwise should be asked for a test like the one on this page.</li>
    </ul>
    <p class="note" style="margin-top:16px">For the accuracy of the company-report figures see <a href="audit.html">Data checks</a>. Each share's page also shows a backtest of the rule-based BUY/SELL signals.
      Nothing on this site is financial advice.</p>`;
  drawGrades();
  if (location.hash && document.getElementById(location.hash.slice(1))) document.getElementById(location.hash.slice(1)).scrollIntoView();
}).catch(() => { document.getElementById('main').innerHTML = '<p class="mute">Could not load the accuracy data.</p>'; });
</script>
