<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CSE Advisor</title>
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --bg:#0f1216; --panel:#171b21; --line:#262c35; --text:#e6e8eb; --mute:#8b95a1;
          --buy:#22c55e; --sell:#ef4444; --hold:#a1a1aa; --accent:#3b82f6; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; gap:10px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 8px 0 0; }
  input, select, button, .btn { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; text-decoration:none; }
  .btn:hover, button:hover { border-color:var(--accent); }
  main { display:grid; grid-template-columns: 560px 1fr; height:calc(100vh - 54px); }
  @media (max-width: 900px) { main { grid-template-columns:1fr; height:auto; } #list { max-height:55vh; } }
  #list { overflow:auto; border-right:1px solid var(--line); }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:7px 8px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { position:sticky; top:0; background:var(--panel); color:var(--mute); font-weight:500; font-size:12px; }
  tr.row { cursor:pointer; } tr.row:hover, tr.sel { background:#1d232b; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .sig { font-weight:600; font-size:12px; }
  .BUY { color:var(--buy); } .SELL { color:var(--sell); } .HOLD { color:var(--hold); }
  .up { color:var(--buy); } .down { color:var(--sell); }
  #detail { overflow:auto; padding:14px; }
  #chart { height:360px; } #rsi, #macd { height:100px; margin-top:6px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px; margin-top:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .card.wide { grid-column:1 / -1; }
  .card h3 { margin:0 0 8px; font-size:13px; color:var(--mute); font-weight:500; }
  .card ul { margin:0; padding-left:18px; } .tag { font-size:10px; font-weight:700; padding:1px 5px; border-radius:4px; vertical-align:middle; } .tag.inv { background:#14532d; color:#86efac; } .tag.trd { background:#1e3a8a; color:#93c5fd; } .tag.wat { background:#3f3f46; color:#d4d4d8; }
  .src { font:11px/1.35 ui-monospace,monospace; color:#cbd5e1; white-space:pre-wrap; word-break:break-word; } summary { cursor:pointer; color:var(--mute); } .card a { color:#93c5fd; } .card table td, .card table th { padding:4px 6px; position:static; } .warn { color:#f59e0b; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; }
  .big { font-size:22px; font-weight:700; }
  .mute { color:var(--mute); } .star { cursor:pointer; color:#eab308; font-size:16px; }
  .note { padding:20px; color:var(--mute); }
  .livedot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--buy); margin-right:5px; animation:pulse 2s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  #intraday { height:140px; margin-top:6px; }
  .badge { background:#ef4444; color:#fff; border-radius:9px; padding:0 6px; font-size:11px; font-weight:700; }
  .abar { display:flex; gap:6px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); flex-wrap:wrap; }
  .chip { padding:3px 9px; font-size:12px; border-radius:12px; } .chip.on { border-color:var(--accent); color:#93c5fd; }
  .secs { padding:6px 10px; font-size:11px; border-bottom:1px solid var(--line); line-height:1.7; }
  .al { display:grid; grid-template-columns:42px 18px 1fr; gap:6px; padding:7px 10px; border-bottom:1px solid var(--line); font-size:13px; }
  .al[data-sym] { cursor:pointer; } .al[data-sym]:hover { background:#1d232b; } .al.big { background:#1a1622; }
  .at { font-variant-numeric:tabular-nums; } .ak { text-align:center; }
  @keyframes fu { from { background:rgba(34,197,94,.45); } to { background:transparent; } }
  @keyframes fd { from { background:rgba(239,68,68,.45); } to { background:transparent; } }
  td.fu { animation:fu 2.5s ease-out; } td.fd { animation:fd 2.5s ease-out; }
  tr.peer { cursor:pointer; } tr.peer:hover { background:#1d232b; } tr.me { background:#1b2433; }
  footer { font-size:11px; color:var(--mute); padding:10px 14px; }
</style>
</head>
<body>
<header>
  <h1>CSE Advisor</h1>
  <input id="q" placeholder="Search symbol/name" size="16" oninput="render()">
  <select id="f" onchange="render()">
    <option value="">All signals</option><option value="invest">📈 Investment picks</option><option value="trade">⚡ Trading picks</option><option value="tradewatch">👀 Trade watch</option><option value="BUY">Buys</option><option value="SELL">Sells</option><option value="watch">★ Favourites</option><option value="value">Value (P/E &lt; 10)</option><option value="div">Dividend ≥ 5%</option><option value="issues">Data issues</option>
  </select>
  <a class="btn" id="addBtn" target="_blank" rel="noopener">+ Add stocks</a>
  <button class="btn" onclick="toggleAlerts()">🔔 Alerts <span id="abadge" class="badge" style="display:none"></span></button>
  <a class="btn" href="accuracy.html">🎯 Accuracy</a>
  <a class="btn" href="audit.html">✓ Data checks</a>
  <span id="live" class="mute"></span>
  <span id="meta" class="mute"></span>
</header>
<main>
  <section id="list">
    <div id="alerts" hidden></div>
    <table id="listTable"><thead><tr><th></th><th>Symbol</th><th class="num">Close</th><th class="num">Chg%</th><th class="num">P/E</th><th>Signal</th><th class="num">Score</th></tr></thead><tbody id="rows"></tbody></table>
    <div id="empty" class="note" hidden></div>
    <footer>Rule-based indicator signals, not financial advice. Data: Colombo Stock Exchange (cse.lk): prices every 15 seconds in market hours, signals after each close.</footer>
  </section>
  <section id="detail"><div class="mute">Select a stock.</div></section>
</main>
<script>
const $ = s => document.querySelector(s);
let all = [], current = null;

// Personal stars live in this browser; the repo's watchlist.txt controls what gets full history.
const store = { get(){ try { return JSON.parse(localStorage.getItem('stars')||'[]'); } catch(e){ return []; } },
                set(v){ try { localStorage.setItem('stars', JSON.stringify(v)); } catch(e){} } };
let stars = new Set(store.get());

// https://USER.github.io/REPO/  ->  https://github.com/USER/REPO/actions/workflows/update.yml
(function(){
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  const repo = location.pathname.split('/').filter(Boolean)[0];
  if (m && repo) $('#addBtn').href = `https://github.com/${m[1]}/${repo}/actions/workflows/update.yml`;
  else $('#addBtn').style.display = 'none';
})();

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sigClass = s => s.includes('BUY') ? 'BUY' : s.includes('SELL') ? 'SELL' : 'HOLD';
const isStar = s => stars.has(s.symbol);  // personal favourites, saved in this browser

// ---------- live: prices, alerts and sector moves every 15 seconds while the market is open ----------
// The "Live prices" job publishes t/HHMMSS.json (every 15 s) and m/HHMM.json (every minute) on the `live` branch.
// Every file has its own name because GitHub caches a file for 5 minutes; a name nobody asked for yet is fresh.
let tick = null, minute = null, peers = null, acc = null, detailCtx = null, liveChart = null, liveSeries = null, changed = {}, dayAlerts = null;
const QS = new URLSearchParams(location.search);          // testing: ?live=<folder>/&now=2026-11-12T12:30:40
const RAW = QS.get('live') || (() => {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  const repo = location.pathname.split('/').filter(Boolean)[0];
  return m && repo ? `https://raw.githubusercontent.com/${m[1]}/${repo}/live/` : null;
})();
const T0 = QS.get('now') ? new Date(QS.get('now')).getTime() - Date.now() : null;
function colomboNow() { return T0 != null ? new Date(Date.now() + T0) : new Date(Date.now() + (330 + new Date().getTimezoneOffset()) * 60000); }
const ymd = t => `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
const two = n => String(n).padStart(2, '0');
function marketWindow() {
  const t = colomboNow(), d = t.getDay(), hm = t.getHours() * 100 + t.getMinutes();
  return d >= 1 && d <= 5 && hm >= 925 && hm <= 1445;
}
async function getJSON(name) {
  try { const r = await fetch(RAW + name, {cache:'no-store'}); return r.ok ? await r.json() : null; } catch (e) { return null; }
}
async function pollTick() {
  if (!RAW || !marketWindow() || document.hidden) return;
  // ask for the tick published about 30 s ago first (it is certain to exist), then older ones
  const base = Math.floor((colomboNow().getTime() - 30000) / 15000) * 15000;
  let t = null;
  for (let k = 0; k < 6 && !t; k++) {
    const d = new Date(base - k * 15000);
    t = await getJSON(`t/${two(d.getHours())}${two(d.getMinutes())}${two(d.getSeconds())}.json`);
  }
  if (!t || t.t.slice(0, 10) !== ymd(colomboNow())) { showLiveStatus(); return; }
  if (tick && t.t <= tick.t) { showLiveStatus(); return; }
  changed = {};
  all.forEach(s => { const r = t.r[s.symbol]; if (r) {
    if (s.live && s.live.p !== r[0]) changed[s.symbol] = r[0] > s.live.p ? 'fu' : 'fd';
    s.live = { p: r[0], c: r[1], v: r[2] }; } });
  tick = t;
  showLiveStatus(); render(); renderAlerts();
  if (current) { updateLiveDetail(current); if (!minute || Date.now() - minute._at > 55000) pollMinute(); }
}
async function pollMinute() {
  if (!RAW) return;
  const now = colomboNow();
  let m = null;
  for (const back of [1, 2, 3]) {
    const d = new Date(now.getTime() - back * 60000);
    m = await getJSON(`m/${two(d.getHours())}${two(d.getMinutes())}.json`);
    if (m) break;
  }
  if (!m || m.date !== ymd(now)) return;
  m._at = Date.now(); m.by = Object.fromEntries(m.rows.map(r => [r.s, r]));
  minute = m;
  if (current) updateLiveDetail(current);
}
function showLiveStatus() {
  const el = $('#live');
  if (!tick) { el.textContent = marketWindow() ? 'Waiting for live prices…' : ''; return; }
  const age = Math.max(0, Math.round((colomboNow().getTime() - new Date(tick.t.replace(' ', 'T')).getTime()) / 1000));
  const a = tick.x && tick.x.aspi;
  el.innerHTML = `${marketWindow() ? '<span class="livedot"></span>' : ''}Live ${esc(tick.t.slice(11))} <span class="mute">(${age < 120 ? age + ' s' : Math.round(age/60) + ' min'} ago)</span>` +
    `${tick.m ? ' · ' + esc(tick.m) : ''}${a && a[0] ? ` · ASPI ${Math.round(a[0]).toLocaleString()} <span class="${a[1]>0?'up':a[1]<0?'down':''}">${a[1]>0?'+':''}${p2(a[1])}%</span>` : ''}`;
}
setInterval(showLiveStatus, 5000);

// ---------- alerts ----------
const KIND = { jump:['▲','up'], drop:['▼','down'], volume:['◉','warn'], high:['★','up'], low:['☆','down'], breakout:['↗','up'], breakdown:['↘','down'],
               sma50:['~',''], gap:['⇅','warn'], peer:['≠','warn'], sector:['▦',''], market:['▣',''] };
let alertFilter = 'all', alertsOpen = false;
const seenKey = () => 'alertsSeen-' + ymd(colomboNow());
function alertList() { return (tick && tick.a) || (dayAlerts && dayAlerts.alerts.slice().reverse()) || []; }
function renderAlerts() {
  const total = tick ? tick.n : (dayAlerts ? dayAlerts.alerts.length : 0);
  let seen = 0; try { seen = +(localStorage.getItem(seenKey()) || 0); } catch (e) {}
  if (alertsOpen) { seen = total; try { localStorage.setItem(seenKey(), total); } catch (e) {} }
  const fresh = Math.max(0, total - seen);
  $('#abadge').textContent = fresh ? fresh : '';
  $('#abadge').style.display = fresh ? '' : 'none';
  document.title = (fresh ? `(${fresh}) ` : '') + 'CSE Advisor';
  if (!alertsOpen) return;
  const list = alertList().filter(a => alertFilter === 'all' || (alertFilter === 'big' ? a.v >= 2 : (a.s && stars.has(a.s))));
  const secs = tick && tick.x && tick.x.sec ? Object.entries(tick.x.sec).sort((a, b) => b[1] - a[1]) : [];
  const day = tick ? tick.t.slice(0, 10) : (dayAlerts ? dayAlerts.date : '');
  $('#alerts').innerHTML = `
    <div class="abar">
      <b>Alerts</b> <span class="mute">${esc(day)} · ${total} today</span>
      <span style="flex:1"></span>
      ${['all','big','fav'].map(k => `<button class="chip ${alertFilter===k?'on':''}" data-af="${k}">${{all:'All',big:'Important',fav:'★ Favourites'}[k]}</button>`).join('')}
      <button class="chip" data-af="close">✕ Close</button>
    </div>
    ${secs.length ? `<div class="secs">${secs.map(([n, v]) => `<span class="${v>0?'up':v<0?'down':'mute'}">${esc(n)} ${v>0?'+':''}${p2(v)}%</span>`).join(' · ')}</div>` : ''}
    ${list.length ? list.map(a => { const k = KIND[a.k] || ['•','']; return `
      <div class="al ${a.v>=2?'big':''}" ${a.s ? `data-sym="${esc(a.s)}"` : ''}>
        <span class="mute at">${esc(a.t.slice(0,5))}</span><span class="${k[1]} ak">${k[0]}</span>
        <span><b>${esc(a.s || 'Market')}</b> ${esc(a.m)}</span></div>`; }).join('')
      : `<div class="note">${total ? 'No alerts match this filter.' : 'No alerts yet. During market hours this list fills as prices, volumes and sectors move sharply.'}</div>`}
    <div class="note" style="font-size:11px">Alerts describe what just happened; they are not predictions. In thinly traded shares a single trade can trigger one.</div>`;
}
function toggleAlerts(on) {
  alertsOpen = on ?? !alertsOpen;
  $('#alerts').hidden = !alertsOpen; $('#listTable').hidden = alertsOpen;
  renderAlerts();
}
document.addEventListener('click', e => {
  const af = e.target.closest('[data-af]');
  if (af) { if (af.dataset.af === 'close') toggleAlerts(false); else { alertFilter = af.dataset.af; renderAlerts(); } return; }
  const al = e.target.closest('.al[data-sym]'); if (al) show(al.dataset.sym);
  const pr = e.target.closest('[data-peer]'); if (pr) show(pr.dataset.peer);
});

function updateLiveDetail(sym) {
  const el = document.getElementById('livebox');
  const r = tick && tick.r[sym];
  if (!r || !el) return;
  const full = minute && minute.by && minute.by[sym];
  const sec = el.dataset.sector, sp = sec && tick.x && tick.x.peers ? tick.x.peers[sec] : null;
  const ob = tick.ob && tick.ob[sym];
  const big = v => v >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : Math.round(v).toLocaleString();
  el.innerHTML = `<b>Live ${esc(tick.t.slice(11))}</b> &nbsp; ${r[0].toFixed(2)} <span class="${r[1]>0?'up':r[1]<0?'down':''}">${r[1]>0?'+':''}${p2(r[1])}%</span>
    <span class="mute">&nbsp; ${full ? `H ${full.h ?? '–'} · L ${full.l ?? '–'} · ` : ''}Vol ${r[2] != null ? Math.round(r[2]).toLocaleString() : '–'}</span>
    ${sp != null ? `<span class="mute"> · ${esc(sec)} peers today <span class="${sp>0?'up':sp<0?'down':''}">${sp>0?'+':''}${p2(sp)}%</span></span>` : ''}
    ${ob ? `<div class="mute" style="font-size:12px;margin-top:2px">Orders waiting (${esc(ob[3])}): buy ${big(ob[0])} · sell ${big(ob[1])} shares${ob[2] ? ` · best bid ${ob[2]}` : ''}</div>` : ''}`;
  if (detailCtx && detailCtx.sym === sym) {
    const p = r[0], day = tick.t.slice(0, 10), lc = detailCtx.last;
    try { detailCtx.cs.update({ time: day, open: (full && full.o) ?? (lc && lc.time === day ? lc.open : p),
      high: Math.max((full && full.h) ?? p, p), low: Math.min((full && full.l) ?? p, p), close: p }); } catch (e) {}
  }
  const intraday = minute && minute.intraday, pts = intraday && intraday.p && intraday.p[sym];
  if (pts && pts.length && document.getElementById('intraday')) {
    document.getElementById('intraday').style.display = '';
    if (!liveChart) {
      liveChart = mkChart($('#intraday'), 140);
      liveChart.applyOptions({ timeScale:{ timeVisible:true, secondsVisible:false } });
      liveSeries = liveChart.addAreaSeries({ lineColor:'#3b82f6', topColor:'rgba(59,130,246,.25)', bottomColor:'rgba(59,130,246,0)', lineWidth:2, title:'Today' });
    }
    const base = Date.parse(intraday.date + 'T00:00:00Z') / 1000;
    const toSec = hhmm => base + (+hhmm.slice(0,2)) * 3600 + (+hhmm.slice(3,5)) * 60;
    const data = []; let k = 0, last = null;   // carry the last price forward to every minute
    intraday.t.forEach((hhmm, idx) => { while (k < pts.length && pts[k][0] <= idx) { last = pts[k][1]; k++; } if (last != null) data.push({ time: toSec(hhmm), value: last }); });
    liveSeries.setData(data);
    liveChart.timeScale().fitContent();
  }
}
setInterval(pollTick, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollTick(); });

async function load() {
  try {
    const [sig, meta] = await Promise.all([fetch('data/signals.json').then(r=>r.json()), fetch('data/meta.json').then(r=>r.json())]);
    all = sig; $('#meta').textContent = `Updated ${meta.updated} · ${meta.stocks} stocks`;
    try { const au = await fetch('data/audit.json').then(r=>r.json());
      if (au.companies_with_reports) $('#meta').textContent += ` · reports: ${au.companies_with_reports} companies, ${au.figures_verified}/${au.figures_total} figures verified`;
    } catch (e) {}
  } catch (e) { all = []; }
  render();
  fetch('data/peers.json').then(r => r.json()).then(p => { peers = p; }).catch(() => {});
  fetch('data/accuracy.json').then(r => r.json()).then(a => { acc = a; }).catch(() => {});
  if (marketWindow()) { pollTick(); }
  else if (RAW) { getJSON('alerts.json').then(a => { dayAlerts = a; renderAlerts(); }); }
  if (location.hash) show(decodeURIComponent(location.hash.slice(1)));
}

function render() {
  const q = $('#q').value.trim().toLowerCase(), f = $('#f').value;
  let rows = all.filter(s => (!q || s.symbol.toLowerCase().includes(q) || (s.name||'').toLowerCase().includes(q)) &&
    (!f || (f === 'watch' ? isStar(s) : f === 'value' ? (s.pe && s.pe < 10) : f === 'div' ? (s.div_yield >= 5) : f === 'issues' ? (s.data_fail > 0) : f === 'invest' ? s.invest : f === 'trade' ? s.trade : f === 'tradewatch' ? (s.trade || s.trade_watch) : sigClass(s.signal) === f)));
  rows.sort((a,b) => (isStar(b) - isStar(a)) || (b.score - a.score));
  $('#empty').hidden = rows.length > 0;
  $('#empty').innerHTML = all.length ? 'No stocks match.' :
    'No data yet. On GitHub open <b>Actions → Update CSE data → Run workflow</b> and enter symbols like <code>JKH.N0000 COMB.N0000</code>.';
  $('#rows').innerHTML = rows.map(s => `
    <tr class="row ${s.symbol===current?'sel':''}" data-sym="${esc(s.symbol)}">
      <td class="star" data-star="${esc(s.symbol)}">${isStar(s)?'★':'☆'}</td>
      <td><b>${esc(s.symbol)}</b><div class="mute" style="font-size:11px">${s.invest?'<span class="tag inv">INVEST</span> ':''}${s.trade?'<span class="tag trd">TRADE</span> ':s.trade_watch?'<span class="tag wat">WATCH</span> ':''}${esc((s.name||'').slice(0, (s.invest||s.trade||s.trade_watch) ? 18 : 26))}</div></td>
      <td class="num ${changed[s.symbol] || ''}">${(s.live ? s.live.p : s.close).toFixed(2)}${s.live ? ' <span class="livedot" title="live"></span>' : ''}</td>
      ${(() => { const c = s.live ? s.live.c : s.change_pct; return `<td class="num ${c>0?'up':c<0?'down':''}">${p2(c)}</td>`; })()}
      <td class="num">${s.pe ?? '<span class="mute">–</span>'}</td>
      <td class="sig ${sigClass(s.signal)}">${esc(s.signal)}</td>
      <td class="num">${s.score}</td>
    </tr>`).join('');
}

$('#rows').addEventListener('click', e => {
  const st = e.target.closest('[data-star]');
  if (st) { const s = st.dataset.star; stars.has(s) ? stars.delete(s) : stars.add(s); store.set([...stars]); render(); return; }
  const tr = e.target.closest('tr.row'); if (tr) show(tr.dataset.sym);
});

const p2 = v => (v == null || isNaN(v)) ? '' : (+v).toFixed(2);
const fmt = (v, suf='') => v == null ? '<span class="mute">–</span>' : `${v}${suf}`;
const pct = v => v == null ? '<span class="mute">–</span>' : `<span class="${v>=0?'up':'down'}">${v>0?'+':''}${p2(v)}%</span>`;
function styleCard(a) {
  const st = a.style; if (!st) return '';
  const li = (arr, cls) => arr.map(x => `<li class="${cls}">${esc(x)}</li>`).join('');
  const head = (on, label, cls) => on ? `<span class="tag ${cls}">${label}</span>` : `<span class="mute">not a ${label.toLowerCase()} pick</span>`;
  return `<div class="card"><h3>Trading or investing?</h3>
    <p style="margin:0 0 4px">${head(st.trade, 'TRADE', 'trd')} ${!st.trade && st.trade_watch ? '<span class="tag wat">WATCH</span> one condition short' : ''}
      <span class="mute" style="font-size:12px">— short-term setup, weeks</span></p>
    <ul style="margin-bottom:8px">${li(st.trade_why, 'up')}${li(st.trade_missing, 'down')}</ul>
    ${st.reward_risk != null ? `<p class="mute" style="font-size:12px;margin:0 0 8px">Target ${st.trade_target} · stop ${st.trade_stop} · reward/risk after ~2.24% round-trip costs: ${st.reward_risk}</p>` : ''}
    <p style="margin:0 0 4px">${head(st.invest, 'INVEST', 'inv')} <span class="mute" style="font-size:12px">— long-term value, verified report figures only</span></p>
    <ul>${li(st.invest_why, 'up')}${li(st.invest_missing, 'down')}</ul></div>`;
}

function peersCard(d, sym) {
  const g = peers && d.sector && peers[d.sector];
  if (!g || g.n < 2) return `<div class="card"><h3>Peers</h3><p class="mute">${d.sector ? esc(d.sector) + ': no other listed companies to compare with.' : 'No industry group on record for this share.'}</p></div>`;
  const me = g.members.find(m => m.s === sym) || {}, md = g.median;
  const rank = (key, asc) => { const v = g.members.filter(m => m[key] != null).sort((a, b) => asc ? a[key] - b[key] : b[key] - a[key]);
    const i = v.findIndex(m => m.s === sym); return i < 0 || v.length < 3 ? '' : ` <span class="mute">· #${i + 1} ${asc ? 'lowest' : 'highest'} of ${v.length}</span>`; };
  const row = (label, key, asc, suf = '', sign = false) => { const v = me[key], m = md[key];
    const f = x => x == null ? '–' : (sign && x > 0 ? '+' : '') + (suf === '%' ? p2(x) : x) + suf;
    return `<span class="mute">${label}</span><span>${v == null ? '<span class="mute">–</span>' : `<b>${f(v)}</b>`} <span class="mute">vs peers ${f(m)}</span>${rank(key, asc)}</span>`; };
  const today = m => { const r = tick && tick.r[m.s]; return r ? r[1] : m.chg; };
  const shown = g.members.slice(0, 10); if (!shown.find(m => m.s === sym) && me.s) shown.push(me);
  return `<div class="card wide"><h3>Peers <span class="mute">· ${esc(d.sector)} · ${g.n} listed</span></h3>
    <div class="kv">
      ${row('P/E', 'pe', true)}${row('Price / book', 'pbv', true)}${row('ROE', 'roe', false, '%')}
      ${row('1 month', 'd20', false, '%', true)}${row('3 months', 'd60', false, '%', true)}${row('Score', 'score', false)}
    </div>
    <table style="margin-top:8px"><tr><th>Most traded peers</th><th class="num">Price</th><th class="num">Today</th><th class="num">1M</th><th class="num">P/E</th><th>Signal</th></tr>
    ${shown.map(m => `<tr class="peer ${m.s === sym ? 'me' : ''}" data-peer="${esc(m.s)}"><td><b>${esc(m.s.split('.')[0])}</b>${m.s.includes('.X') ? '<span class="mute">.X</span>' : ''}${m.invest ? ' <span class="tag inv">INV</span>' : ''}</td>
      <td class="num">${((tick && tick.r[m.s]) ? tick.r[m.s][0] : m.close).toFixed(2)}</td><td class="num">${pct(today(m))}</td><td class="num">${pct(m.d20)}</td>
      <td class="num">${m.pe ?? '<span class="mute">–</span>'}</td><td class="sig ${sigClass(m.signal)}" style="font-size:11px">${esc(m.signal)}</td></tr>`).join('')}</table>
    <p class="mute" style="font-size:11px;margin:8px 0 0">Peer medians use verified report figures only. Tap a peer to open it.</p></div>`;
}

function forecastCard(d) {
  const f = d.forecast, v = acc && acc.validation;
  const swing = d.atr_pct != null ? (d.atr_pct * Math.sqrt(5)).toFixed(1) : null;
  const rel = v ? `<p class="warn" style="font-size:12px;margin:8px 0 0">How reliable is this? Tested on days the model had never seen, its 5 highest-ranked shares each day made a gain after costs
      ${v.top['5'].hit}% of the time (any share: ${v.all.hit}%) and the average result was ${p2(v.top['5'].avg_net)}%. ${v.verdict === 'edge' ? 'That is a measurable edge.' : 'That does not beat trading costs, so do not trade on it alone.'}
      <a href="accuracy.html">See the full accuracy report →</a></p>` : '';
  if (!f) return `<div class="card"><h3>Pattern forecast</h3><p class="mute">Not forecast: this share trades too little (it needs about LKR 2M a day and a price of Rs 5 or more) for a short-term forecast to mean anything.</p>
      ${swing ? `<div class="kv"><span class="mute">Typical 5-day swing</span><span>±${swing}%</span></div>` : ''}</div>`;
  return `<div class="card"><h3>Pattern forecast <span class="mute">· next ${f.days} trading days · from ${esc(f.date)}</span></h3>
    <div class="kv">
      <span class="mute">Chance of a gain after costs</span><span><b>${f.hit != null ? '~' + f.hit + '%' : '–'}</b> ${v ? `<span class="mute">(average share ${v.all.hit}%)</span>` : ''}</span>
      <span class="mute">Pattern rank</span><span>${f.rank} of ${f.n} tradeable shares</span>
      <span class="mute">Model's expected result</span><span class="${f.exp >= 0 ? 'up' : 'down'}">${f.exp > 0 ? '+' : ''}${p2(f.exp)}% after ~2.24% costs</span>
      ${swing ? `<span class="mute">Typical 5-day swing</span><span>±${swing}%</span>` : ''}
    </div>${rel}</div>`;
}

function fibCard(a) {
  const f = a.fib;
  if (!f) return '<div class="card"><h3>Fibonacci</h3><p class="mute">No clear swing (under 10%) in the last 6 months — no levels drawn.</p></div>';
  const rows = Object.entries(f.levels).map(([k, v]) => {
    const near = Math.abs(a.close - v) <= Math.max(0.01 * a.close, 0.005 * a.close);
    return `<tr${near ? ' style="background:#2a2140"' : ''}><td>${k}%</td><td class="num">${v.toFixed(2)}</td><td class="mute">${v > a.close ? 'resistance' : 'support'}</td></tr>`;
  }).join('');
  return `<div class="card"><h3>Fibonacci retracement <span class="mute">· 6-month ${f.trend === 'up' ? 'up-move' : 'down-move'}</span></h3>
    <div class="kv">
      <span class="mute">Swing ${f.trend === 'up' ? 'low → high' : 'high → low'}</span><span>${f.trend === 'up' ? `${f.low.toFixed(2)} (${f.low_date}) → ${f.high.toFixed(2)} (${f.high_date})` : `${f.high.toFixed(2)} (${f.high_date}) → ${f.low.toFixed(2)} (${f.low_date})`}</span>
      <span class="mute">Next support</span><span class="up">${f.next_support != null ? f.next_support.toFixed(2) : '–'}</span>
      <span class="mute">Next resistance</span><span class="down">${f.next_resistance != null ? f.next_resistance.toFixed(2) : '–'}</span>
      <span class="mute">Extensions</span><span>127.2%: ${f.ext['127.2'].toFixed(2)} · 161.8%: ${f.ext['161.8'].toFixed(2)}</span>
    </div>
    <table style="margin-top:8px"><tr><th>Level</th><th class="num">Price</th><th></th></tr>${rows}</table>
    <p class="mute" style="font-size:11px;margin:8px 0 0">In an up-move, pullbacks to 38.2–61.8% often find buyers; a close below 78.6% suggests the up-move has failed. In a down-move the same levels act as resistance. Levels are drawn on the chart.</p></div>`;
}

function fundCard(a) {
  const f = a.fundamentals;
  if (!f) return '<div class="card"><h3>Fundamentals</h3><p class="mute">Reports not read yet — the nightly job works through all companies.</p></div>';
  const V = f.verified || {};
  const tick = k => k in V ? (V[k] ? ' <span class="up" title="verified">✓</span>' : ' <span class="warn" title="not verified - not scored">⚠</span>') : '';
  const yrs = (f.annual||[]).map(y => `<tr><td><a href="${esc(y.url)}" target="_blank" rel="noopener">${esc(y.end)}</a></td>
      <td class="num">${fmt(y.eps)}${y.eps!=null?(y.eps_ok?' <span class="up">✓</span>':' <span class="warn">⚠</span>'):''}</td>
      <td class="num">${fmt(y.dps)}${y.dps!=null?(y.dps_ok?' <span class="up">✓</span>':' <span class="warn">⚠</span>'):''}</td></tr>`).join('');
  const qs = (f.quarters||[]).map(q => `<tr><td><a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(q.end)}</a></td>
      <td class="num">${fmt(q.eps_q)}</td>
      <td class="num">${fmt(q.eps_cum)}${q.eps_cum!=null?` <span class="mute">${q.cum_months}m</span>`+(q.period_ok&&q.eps_ok?' <span class="up">✓</span>':' <span class="warn">⚠</span>'):''}</td>
      <td class="num">${pct(q.profit_growth)}${q.profit_growth!=null?(q.growth_ok?' <span class="up">✓</span>':' <span class="warn">⚠</span>'):''}</td>
      <td class="num">${pct(q.revenue_growth)}</td></tr>`).join('');
  const srcs = (f.quarters||[]).filter(q => q.src && Object.keys(q.src).length).map(q =>
      `<div style="margin-top:6px"><b>${esc(q.end)}</b>${Object.entries(q.src).map(([k,v]) => `<div class="src"><span class="mute">${esc(k)}:</span> ${esc(v)}</div>`).join('')}</div>`).join('')
    + (f.annual||[]).filter(y => y.src_eps || y.src_dps).map(y =>
      `<div style="margin-top:6px"><b>${esc(y.end)} annual</b>${['eps','dps'].filter(k=>y['src_'+k]).map(k => `<div class="src"><span class="mute">${k}:</span> ${esc(y['src_'+k])}</div>`).join('')}</div>`).join('');
  const cs = f.check_summary || {ok:0,warn:0,fail:0};
  const icon = {ok:'<span class="up">✓</span>', warn:'<span class="warn">⚠</span>', fail:'<span class="down">✗</span>'};
  const checks = (f.checks||[]).map(c => `<li style="list-style:none;margin-left:-18px">${icon[c.level]} <span class="mute">${esc(c.end)}</span> ${esc(c.msg)}</li>`).join('');
  return `<div class="card"><h3>Fundamentals <span class="mute">· ${f.quarters_read} quarterly + ${f.annuals_read} annual reports · ${esc(f.confidence)} data</span></h3>
    ${f.ai_read ? `<div style="background:#132a1f;border:1px solid #1f5136;border-radius:6px;padding:8px 10px;margin:4px 0 10px;font-size:13px">
      📖 <b>Key figures read by Claude</b> from the reports on ${esc(f.ai_read.at)} (${esc((f.ai_read.latest||{}).end||'')} interim${(f.ai_read.fy||{}).end?` and year to ${esc(f.ai_read.fy.end)}`:''}).
      ${f.ai_read.notes ? `<div class="mute" style="margin-top:4px">${esc(f.ai_read.notes)}</div>` : ''}</div>` : ''}
    <ul>${(a.fund_reasons||[]).map(r=>`<li>${esc(r)}</li>`).join('') || '<li class="mute">No verified fundamental points</li>'}</ul>
    <div class="kv" style="margin-top:8px">
      <span class="mute">EPS (12 months)</span><span>${fmt(f.eps_ttm)}${tick('eps_ttm')} <span class="mute" style="font-size:11px">${esc(f.eps_basis||'')}</span></span>
      <span class="mute">P/E</span><span>${fmt(f.pe)}${tick('pe')}</span>
      <span class="mute">Net assets/share</span><span>${fmt(f.navps)}${tick('navps')} ${f.pbv!=null?`<span class="mute">(P/BV ${f.pbv})</span>`:''}</span>
      <span class="mute">ROE</span><span>${f.roe!=null?p2(f.roe)+'%':fmt(null)}${tick('roe')}</span>
      <span class="mute">EPS growth (year-to-date)</span><span>${pct(f.eps_growth_ytd)}${tick('eps_growth_ytd')} ${f.eps_growth_months?`<span class="mute">${f.eps_growth_months} months vs last year</span>`:''} ${f.eps_growth_hit?`<span class="mute">(${f.eps_growth_hit} verified reports up)</span>`:''}</span>
      <span class="mute">Profit growth (latest column)</span><span>${pct(f.profit_growth)}${tick('profit_growth')}</span>
      <span class="mute">Revenue growth</span><span>${pct(f.revenue_growth)}${tick('revenue_growth')}</span>
      <span class="mute">Dividend/share</span><span>${fmt(f.dps)}${tick('div_yield')} ${f.div_yield!=null?`<span class="mute">(yield ${p2(f.div_yield)}%)</span>`:''}</span>
      <span class="mute">EPS growth/yr</span><span>${f.eps_cagr!=null?pct(f.eps_cagr)+tick('eps_cagr')+` <span class="mute">over ${f.eps_cagr_years}y</span>`:fmt(null)}</span>
    </div>
    <p class="mute" style="font-size:12px;margin:8px 0 0">✓ verified by a cross-check · ⚠ not verified — shown, but <b>not used in the score</b>.</p>
    ${yrs?`<h3 style="margin-top:12px">Annual reports</h3><table><tr><th>Year end</th><th class="num">EPS</th><th class="num">DPS</th></tr>${yrs}</table>`:''}
    ${qs?`<h3 style="margin-top:12px">Quarterly reports</h3><table><tr><th>Period end</th><th class="num">EPS quarter</th><th class="num">EPS year-to-date</th><th class="num">Profit YoY</th><th class="num">Revenue YoY</th></tr>${qs}</table>`:''}
    <details style="margin-top:10px"><summary>Data checks: ${cs.ok} passed · ${cs.warn} warnings · ${cs.fail} failed · <a href="audit.html#${encodeURIComponent(a.symbol||current)}">all checks page</a></summary><ul style="margin-top:6px">${checks}</ul></details>
    <details style="margin-top:6px"><summary>Exact lines read from the PDFs</summary>${srcs || '<p class="mute">none</p>'}</details>
  </div>`;
}

function mkChart(el, h) {
  return LightweightCharts.createChart(el, { height:h, layout:{ background:{color:'#0f1216'}, textColor:'#8b95a1' },
    grid:{ vertLines:{color:'#1b2028'}, horzLines:{color:'#1b2028'} }, timeScale:{ borderColor:'#262c35' },
    rightPriceScale:{ borderColor:'#262c35' }, autoSize:true });
}

async function show(sym) {
  current = sym; render(); detailCtx = null;
  if (alertsOpen && innerWidth < 900) toggleAlerts(false);
  if (!peers) { try { peers = await (await fetch('data/peers.json')).json(); } catch (e) {} }
  let d;
  try { d = await (await fetch('data/stocks/' + encodeURIComponent(sym) + '.json')).json(); }
  catch (e) { $('#detail').innerHTML = `<div class="mute">No data for ${esc(sym)}.</div>`; return; }
  const a = d.advice, b = d.backtest;
  $('#detail').innerHTML = `
    <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
      <span class="big">${esc(sym)}</span>
      <span class="big sig ${sigClass(a.signal)}">${esc(a.signal)}</span><span class="mute">score ${a.score} (technical ${a.tech_score}${a.fund_score!=null?`, fundamentals ${a.fund_score}`:''}) · ${a.date}</span>
    </div>
    <div class="mute" style="font-size:12px;margin-top:2px">${esc(d.sector || '')}${d.perf ? ` · 1 week ${pct(d.perf.d5)} · 1 month ${pct(d.perf.d20)} · 3 months ${pct(d.perf.d60)}` : ''}</div>
    <div id="livebox" class="mute" style="margin-top:6px" data-sector="${esc(d.sector || '')}"></div><div id="intraday" style="display:none"></div>
    <div id="chart"></div><div id="rsi"></div><div id="macd"></div>
    <div class="cards">
      <div class="card"><h3>Technical reasons</h3><ul>${a.reasons.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
        ${a.warnings.map(w=>`<p class="warn">⚠ ${esc(w)}</p>`).join('')}</div>
      ${styleCard(a)}
      ${peersCard(d, sym)}
      ${forecastCard(d)}
      ${fibCard(a)}
      ${fundCard(a)}
      <div class="card"><h3>Levels</h3><div class="kv">
        <span class="mute">Close</span><span>${a.close}</span>
        <span class="mute">RSI</span><span>${a.rsi ?? '–'}</span>
        <span class="mute">Suggested stop</span><span class="down">${a.stop ?? '–'}</span>
        <span class="mute">Target</span><span class="up">${a.target ?? '–'}</span></div></div>
      ${b ? `<div class="card"><h3>Backtest of these rules on ${esc(sym)}</h3><div class="kv">
        <span class="mute">Period</span><span>${b.period}</span>
        <span class="mute">Strategy</span><span class="${b.strategy_return_pct>=0?'up':'down'}">${p2(b.strategy_return_pct)}%</span>
        <span class="mute">Buy &amp; hold</span><span class="${b.buy_hold_return_pct>=0?'up':'down'}">${p2(b.buy_hold_return_pct)}%</span>
        <span class="mute">Trades</span><span>${b.trades} (win ${b.win_rate_pct ?? '–'}%)</span>
        <span class="mute">Max drawdown</span><span class="down">${p2(b.max_drawdown_pct)}%</span></div>
        <p class="mute" style="font-size:12px;margin:8px 0 0">Includes ~1.12% cost per side. Past results don’t predict future ones.</p></div>`
        : '<div class="card"><h3>Backtest</h3><p class="mute">Needs 60+ days of history.</p></div>'}
    </div>`;

  liveChart = null; liveSeries = null;
  const c = mkChart($('#chart'), 360);
  const cs = c.addCandlestickSeries({ upColor:'#22c55e', downColor:'#ef4444', borderVisible:false, wickUpColor:'#22c55e', wickDownColor:'#ef4444' });
  cs.setData(d.candles);
  if (a && a.fib) {
    Object.entries(a.fib.levels).forEach(([k, v]) => cs.createPriceLine({ price: v, color: k === '61.8' || k === '38.2' ? '#a78bfa' : '#6b5b95',
      lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: 'Fib ' + k + '%' }));
    cs.createPriceLine({ price: a.fib.high, color: '#475569', lineWidth: 1, lineStyle: 1, axisLabelVisible: false, title: 'swing high' });
    cs.createPriceLine({ price: a.fib.low, color: '#475569', lineWidth: 1, lineStyle: 1, axisLabelVisible: false, title: 'swing low' });
  }
  c.addLineSeries({ color:'#3b82f6', lineWidth:1, title:'SMA20' }).setData(d.sma20);
  c.addLineSeries({ color:'#f59e0b', lineWidth:1, title:'SMA50' }).setData(d.sma50);
  const v = c.addHistogramSeries({ priceScaleId:'vol', priceFormat:{type:'volume'}, color:'#334155' });
  c.priceScale('vol').applyOptions({ scaleMargins:{ top:0.8, bottom:0 } });
  v.setData(d.volume);
  const r = mkChart($('#rsi'), 100);
  const rs = r.addLineSeries({ color:'#a78bfa', lineWidth:1, title:'RSI' }); rs.setData(d.rsi);
  [30,70].forEach(p => rs.createPriceLine({ price:p, color:'#475569', lineStyle:2, lineWidth:1 }));
  const m = mkChart($('#macd'), 100);
  m.addHistogramSeries({ title:'MACD hist' }).setData(d.macd_hist.map(x => ({...x, color: x.value>=0?'#22c55e':'#ef4444'})));
  const charts = [c, r, m];
  charts.forEach(src => src.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if (range) charts.filter(x => x!==src).forEach(x => x.timeScale().setVisibleLogicalRange(range));
  }));
  c.timeScale().fitContent();
  // live: today's candle, the minute chart and the peers line update on every tick
  detailCtx = { sym, cs, last: d.candles[d.candles.length - 1] };
  if (tick) { updateLiveDetail(sym); pollMinute(); }
  if (innerWidth < 900) $('#detail').scrollIntoView({ behavior:'smooth' });
}

load();
</script>
</body>
</html>
