<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CSE Advisor</title>
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --bg:#0f1216; --panel:#171b21; --line:#262c35; --text:#e6e8eb; --mute:#8b95a1;
          --buy:#22c55e; --sell:#ef4444; --hold:#a1a1aa; --accent:#3b82f6; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; gap:10px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 8px 0 0; }
  input, select, button, .btn { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; text-decoration:none; }
  .btn:hover, button:hover { border-color:var(--accent); }
  main { display:grid; grid-template-columns: 560px 1fr; height:calc(100vh - 54px); }
  @media (max-width: 900px) { main { grid-template-columns:1fr; height:auto; } #list { max-height:55vh; } }
  #list { overflow:auto; border-right:1px solid var(--line); }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:7px 8px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { position:sticky; top:0; background:var(--panel); color:var(--mute); font-weight:500; font-size:12px; }
  tr.row { cursor:pointer; } tr.row:hover, tr.sel { background:#1d232b; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .sig { font-weight:600; font-size:12px; }
  .BUY { color:var(--buy); } .SELL { color:var(--sell); } .HOLD { color:var(--hold); }
  .up { color:var(--buy); } .down { color:var(--sell); }
  #detail { overflow:auto; padding:14px; }
  #chart { height:360px; } #rsi, #macd { height:100px; margin-top:6px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px; margin-top:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .card h3 { margin:0 0 8px; font-size:13px; color:var(--mute); font-weight:500; }
  .card ul { margin:0; padding-left:18px; } .src { font:11px/1.35 ui-monospace,monospace; color:#cbd5e1; white-space:pre-wrap; word-break:break-word; } summary { cursor:pointer; color:var(--mute); } .card a { color:#93c5fd; } .card table td, .card table th { padding:4px 6px; position:static; } .warn { color:#f59e0b; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; }
  .big { font-size:22px; font-weight:700; }
  .mute { color:var(--mute); } .star { cursor:pointer; color:#eab308; font-size:16px; }
  .note { padding:20px; color:var(--mute); }
  .livedot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--buy); margin-right:5px; animation:pulse 2s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  #intraday { height:140px; margin-top:6px; }
  footer { font-size:11px; color:var(--mute); padding:10px 14px; }
</style>
</head>
<body>
<header>
  <h1>CSE Advisor</h1>
  <input id="q" placeholder="Search symbol/name" size="16" oninput="render()">
  <select id="f" onchange="render()">
    <option value="">All signals</option><option value="BUY">Buys</option><option value="SELL">Sells</option><option value="watch">★ Favourites</option><option value="value">Value (P/E &lt; 10)</option><option value="div">Dividend ≥ 5%</option><option value="issues">Data issues</option>
  </select>
  <a class="btn" id="addBtn" target="_blank" rel="noopener">+ Add stocks</a>
  <span id="live" class="mute"></span>
  <span id="meta" class="mute"></span>
</header>
<main>
  <section id="list">
    <table><thead><tr><th></th><th>Symbol</th><th class="num">Close</th><th class="num">Chg%</th><th class="num">P/E</th><th>Signal</th><th class="num">Score</th></tr></thead><tbody id="rows"></tbody></table>
    <div id="empty" class="note" hidden></div>
    <footer>Rule-based indicator signals, not financial advice. Data: Colombo Stock Exchange (cse.lk), updated after each session.</footer>
  </section>
  <section id="detail"><div class="mute">Select a stock.</div></section>
</main>
<script>
const $ = s => document.querySelector(s);
let all = [], current = null;

// Personal stars live in this browser; the repo's watchlist.txt controls what gets full history.
const store = { get(){ try { return JSON.parse(localStorage.getItem('stars')||'[]'); } catch(e){ return []; } },
                set(v){ try { localStorage.setItem('stars', JSON.stringify(v)); } catch(e){} } };
let stars = new Set(store.get());

// https://USER.github.io/REPO/  ->  https://github.com/USER/REPO/actions/workflows/update.yml
(function(){
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  const repo = location.pathname.split('/').filter(Boolean)[0];
  if (m && repo) $('#addBtn').href = `https://github.com/${m[1]}/${repo}/actions/workflows/update.yml`;
  else $('#addBtn').style.display = 'none';
})();

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sigClass = s => s.includes('BUY') ? 'BUY' : s.includes('SELL') ? 'SELL' : 'HOLD';
const isStar = s => stars.has(s.symbol);  // personal favourites, saved in this browser

// ---------- live prices (published each minute during market hours by the "Live prices" job) ----------
let live = null, intraday = null, liveChart = null, liveSeries = null;
const RAW = (() => {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  const repo = location.pathname.split('/').filter(Boolean)[0];
  return m && repo ? `https://raw.githubusercontent.com/${m[1]}/${repo}/live/` : null;
})();
function colomboNow() { return new Date(Date.now() + (330 + new Date().getTimezoneOffset()) * 60000); }
function marketWindow() {
  const t = colomboNow(), d = t.getDay(), hm = t.getHours() * 100 + t.getMinutes();
  return d >= 1 && d <= 5 && hm >= 925 && hm <= 1445;
}
async function pollLive(force) {
  if (!RAW || (!force && (!marketWindow() || document.hidden))) return;
  try {
    // each minute is published under its own name (m/HHMM.json) so GitHub's 5-minute cache can't serve stale prices
    const name = mins => { const t = new Date(colomboNow().getTime() - mins * 60000);
      return 'm/' + String(t.getHours()).padStart(2,'0') + String(t.getMinutes()).padStart(2,'0') + '.json'; };
    let l = null;
    for (const back of [1, 2, 3]) {
      const r = await fetch(RAW + name(back), {cache:'no-store'});
      if (r.ok) { l = await r.json(); break; }
    }
    if (!l) { const r = await fetch(RAW + 'live.json', {cache:'no-store'}); l = r.ok ? await r.json() : null; }
    const i = l && l.intraday ? l.intraday : intraday;
    const today = colomboNow().toISOString().slice(0, 10);
    if (!l || l.date !== today) { $('#live').textContent = ''; return; }
    live = l; intraday = i;
    const by = Object.fromEntries(l.rows.map(r => [r.s, r]));
    all.forEach(s => { const r = by[s.symbol]; if (r) { s.live = r; } });
    const open = marketWindow();
    $('#live').innerHTML = `${open ? '<span class="livedot"></span>' : ''}Live ${esc(l.updated.slice(11, 16))}${l.market ? ' · ' + esc(l.market) : ''}`;
    render();
    if (current && by[current]) updateLiveDetail(current);
  } catch (e) { /* keep last values */ }
}
function updateLiveDetail(sym) {
  const r = live && live.rows.find(x => x.s === sym);
  const el = document.getElementById('livebox');
  if (!r || !el) return;
  el.innerHTML = `<b>Live ${esc(live.updated.slice(11, 16))}</b> &nbsp; ${r.p.toFixed(2)} <span class="${r.c>0?'up':r.c<0?'down':''}">${r.c>0?'+':''}${p2(r.c)}%</span>
    <span class="mute">&nbsp; H ${r.h ?? '–'} · L ${r.l ?? '–'} · Vol ${r.v != null ? Math.round(r.v).toLocaleString() : '–'}</span>`;
  const pts = intraday && intraday.p && intraday.p[sym];
  if (pts && pts.length && document.getElementById('intraday')) {
    if (!liveChart) {
      liveChart = mkChart($('#intraday'), 140);
      liveChart.applyOptions({ timeScale:{ timeVisible:true, secondsVisible:false } });
      liveSeries = liveChart.addAreaSeries({ lineColor:'#3b82f6', topColor:'rgba(59,130,246,.25)', bottomColor:'rgba(59,130,246,0)', lineWidth:2, title:'Today' });
    }
    const base = Date.parse(intraday.date + 'T00:00:00Z') / 1000;
    const toSec = hhmm => base + (+hhmm.slice(0,2)) * 3600 + (+hhmm.slice(3,5)) * 60;
    // carry the last price forward to every minute
    const data = []; let k = 0, last = null;
    intraday.t.forEach((hhmm, idx) => { while (k < pts.length && pts[k][0] <= idx) { last = pts[k][1]; k++; } if (last != null) data.push({ time: toSec(hhmm), value: last }); });
    liveSeries.setData(data);
    liveChart.timeScale().fitContent();
  }
}
setInterval(() => pollLive(false), 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollLive(false); });

async function load() {
  try {
    const [sig, meta] = await Promise.all([fetch('data/signals.json').then(r=>r.json()), fetch('data/meta.json').then(r=>r.json())]);
    all = sig; $('#meta').textContent = `Updated ${meta.updated} · ${meta.stocks} stocks`;
    try { const au = await fetch('data/audit.json').then(r=>r.json());
      if (au.companies_with_reports) $('#meta').textContent += ` · reports: ${au.companies_with_reports} companies, ${au.figures_verified}/${au.figures_total} figures verified`;
    } catch (e) {}
  } catch (e) { all = []; }
  render();
  pollLive(true);
}

function render() {
  const q = $('#q').value.trim().toLowerCase(), f = $('#f').value;
  let rows = all.filter(s => (!q || s.symbol.toLowerCase().includes(q) || (s.name||'').toLowerCase().includes(q)) &&
    (!f || (f === 'watch' ? isStar(s) : f === 'value' ? (s.pe && s.pe < 10) : f === 'div' ? (s.div_yield >= 5) : f === 'issues' ? (s.data_fail > 0) : sigClass(s.signal) === f)));
  rows.sort((a,b) => (isStar(b) - isStar(a)) || (b.score - a.score));
  $('#empty').hidden = rows.length > 0;
  $('#empty').innerHTML = all.length ? 'No stocks match.' :
    'No data yet. On GitHub open <b>Actions → Update CSE data → Run workflow</b> and enter symbols like <code>JKH.N0000 COMB.N0000</code>.';
  $('#rows').innerHTML = rows.map(s => `
    <tr class="row ${s.symbol===current?'sel':''}" data-sym="${esc(s.symbol)}">
      <td class="star" data-star="${esc(s.symbol)}">${isStar(s)?'★':'☆'}</td>
      <td><b>${esc(s.symbol)}</b><div class="mute" style="font-size:11px">${esc((s.name||'').slice(0,26))}</div></td>
      <td class="num">${(s.live ? s.live.p : s.close).toFixed(2)}${s.live ? ' <span class="livedot" title="live"></span>' : ''}</td>
      ${(() => { const c = s.live ? s.live.c : s.change_pct; return `<td class="num ${c>0?'up':c<0?'down':''}">${p2(c)}</td>`; })()}
      <td class="num">${s.pe ?? '<span class="mute">–</span>'}</td>
      <td class="sig ${sigClass(s.signal)}">${esc(s.signal)}</td>
      <td class="num">${s.score}</td>
    </tr>`).join('');
}

$('#rows').addEventListener('click', e => {
  const st = e.target.closest('[data-star]');
  if (st) { const s = st.dataset.star; stars.has(s) ? stars.delete(s) : stars.add(s); store.set([...stars]); render(); return; }
  const tr = e.target.closest('tr.row'); if (tr) show(tr.dataset.sym);
});

const p2 = v => (v == null || isNaN(v)) ? '' : (+v).toFixed(2);
const fmt = (v, suf='') => v == null ? '<span class="mute">–</span>' : `${v}${suf}`;
const pct = v => v == null ? '<span class="mute">–</span>' : `<span class="${v>=0?'up':'down'}">${v>0?'+':''}${p2(v)}%</span>`;
function fundCard(a) {
  const f = a.fundamentals;
  if (!f) return '<div class="card"><h3>Fundamentals</h3><p class="mute">Reports not read yet — the nightly job works through all companies.</p></div>';
  const V = f.verified || {};
  const tick = k => k in V ? (V[k] ? ' <span class="up" title="verified">✓</span>' : ' <span class="warn" title="not verified - not scored">⚠</span>') : '';
  const yrs = (f.annual||[]).map(y => `<tr><td><a href="${esc(y.url)}" target="_blank" rel="noopener">${esc(y.end)}</a></td>
      <td class="num">${fmt(y.eps)}${y.eps!=null?(y.eps_ok?' <span class="up">✓</span>':' <span class="warn">⚠</span>'):''}</td>
      <td class="num">${fmt(y.dps)}${y.dps!=null?(y.dps_ok?' <span class="up">✓</span>':' <span class="warn">⚠</span>'):''}</td></tr>`).join('');
  const qs = (f.quarters||[]).map(q => `<tr><td><a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(q.end)}</a></td>
      <td class="num">${fmt(q.eps_q)}</td>
      <td class="num">${fmt(q.eps_cum)}${q.eps_cum!=null?` <span class="mute">${q.cum_months}m</span>`+(q.period_ok&&q.eps_ok?' <span class="up">✓</span>':' <span class="warn">⚠</span>'):''}</td>
      <td class="num">${pct(q.profit_growth)}${q.profit_growth!=null?(q.growth_ok?' <span class="up">✓</span>':' <span class="warn">⚠</span>'):''}</td>
      <td class="num">${pct(q.revenue_growth)}</td></tr>`).join('');
  const srcs = (f.quarters||[]).filter(q => q.src && Object.keys(q.src).length).map(q =>
      `<div style="margin-top:6px"><b>${esc(q.end)}</b>${Object.entries(q.src).map(([k,v]) => `<div class="src"><span class="mute">${esc(k)}:</span> ${esc(v)}</div>`).join('')}</div>`).join('')
    + (f.annual||[]).filter(y => y.src_eps || y.src_dps).map(y =>
      `<div style="margin-top:6px"><b>${esc(y.end)} annual</b>${['eps','dps'].filter(k=>y['src_'+k]).map(k => `<div class="src"><span class="mute">${k}:</span> ${esc(y['src_'+k])}</div>`).join('')}</div>`).join('');
  const cs = f.check_summary || {ok:0,warn:0,fail:0};
  const icon = {ok:'<span class="up">✓</span>', warn:'<span class="warn">⚠</span>', fail:'<span class="down">✗</span>'};
  const checks = (f.checks||[]).map(c => `<li style="list-style:none;margin-left:-18px">${icon[c.level]} <span class="mute">${esc(c.end)}</span> ${esc(c.msg)}</li>`).join('');
  return `<div class="card"><h3>Fundamentals <span class="mute">· ${f.quarters_read} quarterly + ${f.annuals_read} annual reports · ${esc(f.confidence)} data</span></h3>
    <ul>${(a.fund_reasons||[]).map(r=>`<li>${esc(r)}</li>`).join('') || '<li class="mute">No verified fundamental points</li>'}</ul>
    <div class="kv" style="margin-top:8px">
      <span class="mute">EPS (12 months)</span><span>${fmt(f.eps_ttm)}${tick('eps_ttm')} <span class="mute" style="font-size:11px">${esc(f.eps_basis||'')}</span></span>
      <span class="mute">P/E</span><span>${fmt(f.pe)}${tick('pe')}</span>
      <span class="mute">Net assets/share</span><span>${fmt(f.navps)}${tick('navps')} ${f.pbv!=null?`<span class="mute">(P/BV ${f.pbv})</span>`:''}</span>
      <span class="mute">ROE</span><span>${f.roe!=null?p2(f.roe)+'%':fmt(null)}${tick('roe')}</span>
      <span class="mute">EPS growth (year-to-date)</span><span>${pct(f.eps_growth_ytd)}${tick('eps_growth_ytd')} ${f.eps_growth_months?`<span class="mute">${f.eps_growth_months} months vs last year</span>`:''} ${f.eps_growth_hit?`<span class="mute">(${f.eps_growth_hit} verified reports up)</span>`:''}</span>
      <span class="mute">Profit growth (latest column)</span><span>${pct(f.profit_growth)}${tick('profit_growth')}</span>
      <span class="mute">Revenue growth</span><span>${pct(f.revenue_growth)}${tick('revenue_growth')}</span>
      <span class="mute">Dividend/share</span><span>${fmt(f.dps)}${tick('div_yield')} ${f.div_yield!=null?`<span class="mute">(yield ${p2(f.div_yield)}%)</span>`:''}</span>
      <span class="mute">EPS growth/yr</span><span>${f.eps_cagr!=null?pct(f.eps_cagr)+tick('eps_cagr')+` <span class="mute">over ${f.eps_cagr_years}y</span>`:fmt(null)}</span>
    </div>
    <p class="mute" style="font-size:12px;margin:8px 0 0">✓ verified by a cross-check · ⚠ not verified — shown, but <b>not used in the score</b>.</p>
    ${yrs?`<h3 style="margin-top:12px">Annual reports</h3><table><tr><th>Year end</th><th class="num">EPS</th><th class="num">DPS</th></tr>${yrs}</table>`:''}
    ${qs?`<h3 style="margin-top:12px">Quarterly reports</h3><table><tr><th>Period end</th><th class="num">EPS quarter</th><th class="num">EPS year-to-date</th><th class="num">Profit YoY</th><th class="num">Revenue YoY</th></tr>${qs}</table>`:''}
    <details style="margin-top:10px"><summary>Data checks: ${cs.ok} passed · ${cs.warn} warnings · ${cs.fail} failed</summary><ul style="margin-top:6px">${checks}</ul></details>
    <details style="margin-top:6px"><summary>Exact lines read from the PDFs</summary>${srcs || '<p class="mute">none</p>'}</details>
  </div>`;
}

function mkChart(el, h) {
  return LightweightCharts.createChart(el, { height:h, layout:{ background:{color:'#0f1216'}, textColor:'#8b95a1' },
    grid:{ vertLines:{color:'#1b2028'}, horzLines:{color:'#1b2028'} }, timeScale:{ borderColor:'#262c35' },
    rightPriceScale:{ borderColor:'#262c35' }, autoSize:true });
}

async function show(sym) {
  current = sym; render();
  let d;
  try { d = await (await fetch('data/stocks/' + encodeURIComponent(sym) + '.json')).json(); }
  catch (e) { $('#detail').innerHTML = `<div class="mute">No data for ${esc(sym)}.</div>`; return; }
  const a = d.advice, b = d.backtest;
  $('#detail').innerHTML = `
    <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
      <span class="big">${esc(sym)}</span>
      <span class="big sig ${sigClass(a.signal)}">${esc(a.signal)}</span><span class="mute">score ${a.score} (technical ${a.tech_score}${a.fund_score!=null?`, fundamentals ${a.fund_score}`:''}) · ${a.date}</span>
    </div>
    <div id="livebox" class="mute" style="margin-top:6px"></div><div id="intraday"></div>
    <div id="chart"></div><div id="rsi"></div><div id="macd"></div>
    <div class="cards">
      <div class="card"><h3>Technical reasons</h3><ul>${a.reasons.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
        ${a.warnings.map(w=>`<p class="warn">⚠ ${esc(w)}</p>`).join('')}</div>
      ${fundCard(a)}
      <div class="card"><h3>Levels</h3><div class="kv">
        <span class="mute">Close</span><span>${a.close}</span>
        <span class="mute">RSI</span><span>${a.rsi ?? '–'}</span>
        <span class="mute">Suggested stop</span><span class="down">${a.stop ?? '–'}</span>
        <span class="mute">Target</span><span class="up">${a.target ?? '–'}</span></div></div>
      ${b ? `<div class="card"><h3>Backtest of these rules on ${esc(sym)}</h3><div class="kv">
        <span class="mute">Period</span><span>${b.period}</span>
        <span class="mute">Strategy</span><span class="${b.strategy_return_pct>=0?'up':'down'}">${p2(b.strategy_return_pct)}%</span>
        <span class="mute">Buy &amp; hold</span><span class="${b.buy_hold_return_pct>=0?'up':'down'}">${p2(b.buy_hold_return_pct)}%</span>
        <span class="mute">Trades</span><span>${b.trades} (win ${b.win_rate_pct ?? '–'}%)</span>
        <span class="mute">Max drawdown</span><span class="down">${p2(b.max_drawdown_pct)}%</span></div>
        <p class="mute" style="font-size:12px;margin:8px 0 0">Includes ~1.12% cost per side. Past results don’t predict future ones.</p></div>`
        : '<div class="card"><h3>Backtest</h3><p class="mute">Needs 60+ days of history.</p></div>'}
    </div>`;

  liveChart = null; liveSeries = null;
  const c = mkChart($('#chart'), 360);
  const cs = c.addCandlestickSeries({ upColor:'#22c55e', downColor:'#ef4444', borderVisible:false, wickUpColor:'#22c55e', wickDownColor:'#ef4444' });
  cs.setData(d.candles);
  c.addLineSeries({ color:'#3b82f6', lineWidth:1, title:'SMA20' }).setData(d.sma20);
  c.addLineSeries({ color:'#f59e0b', lineWidth:1, title:'SMA50' }).setData(d.sma50);
  const v = c.addHistogramSeries({ priceScaleId:'vol', priceFormat:{type:'volume'}, color:'#334155' });
  c.priceScale('vol').applyOptions({ scaleMargins:{ top:0.8, bottom:0 } });
  v.setData(d.volume);
  const r = mkChart($('#rsi'), 100);
  const rs = r.addLineSeries({ color:'#a78bfa', lineWidth:1, title:'RSI' }); rs.setData(d.rsi);
  [30,70].forEach(p => rs.createPriceLine({ price:p, color:'#475569', lineStyle:2, lineWidth:1 }));
  const m = mkChart($('#macd'), 100);
  m.addHistogramSeries({ title:'MACD hist' }).setData(d.macd_hist.map(x => ({...x, color: x.value>=0?'#22c55e':'#ef4444'})));
  const charts = [c, r, m];
  charts.forEach(src => src.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if (range) charts.filter(x => x!==src).forEach(x => x.timeScale().setVisibleLogicalRange(range));
  }));
  c.timeScale().fitContent();
  // live: update today's candle, and draw today's minute chart
  const lr = live && live.rows.find(x => x.s === sym);
  if (lr) {
    const today = live.date, lastC = d.candles[d.candles.length - 1];
    const candle = { time: today, open: lr.o ?? (lastC && lastC.time === today ? lastC.open : lr.p),
                     high: Math.max(lr.h ?? lr.p, lr.p), low: Math.min(lr.l ?? lr.p, lr.p), close: lr.p };
    cs.update(candle);
    updateLiveDetail(sym);
  } else { const ib = document.getElementById('intraday'); if (ib) ib.style.display = 'none'; }
  if (innerWidth < 900) $('#detail').scrollIntoView({ behavior:'smooth' });
}

load();
</script>
