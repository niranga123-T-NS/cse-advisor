<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c111b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CSE Advisor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Market history, CSE Advisor</title>
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<link rel="stylesheet" href="app.css">
<style>
  .points { margin:12px 0 0; padding-left:20px; max-width:86ch; } .points li { margin-bottom:8px; }
  tr.hi td { background:var(--sapphire-soft); }
  #chart { height:340px; margin:10px 0 0; }
  @media (max-width:640px) { #chart { height:260px; } }
</style>
</head>
<body class="app" data-page="market" data-title="Market history">
<script src="app.js"></script>
<main class="page" id="main"><p class="mute">Loading…</p></main>
<script>
const A = window.CSEApp, esc = A.esc;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dmy = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${+dd} ${MON[m - 1]} ${y}`; };
const my = d => { if (!d) return ''; const [y, m] = d.split('-'); return `${MON[m - 1]} ${y}`; };
const sg = (v, n = 1) => v == null ? '–' : `<span class="${v > 0 ? 'ok' : v < 0 ? 'fail' : ''}">${v > 0 ? '+' : ''}${(+v).toFixed(n)}%</span>`;
const num = v => v == null ? '–' : (+v).toLocaleString(undefined, { maximumFractionDigits: 0 });
const FULL = { Jan:'January', Feb:'February', Mar:'March', Apr:'April', May:'May', Jun:'June', Jul:'July', Aug:'August', Sep:'September', Oct:'October', Nov:'November', Dec:'December' };
const DAY = { Mon:'Monday', Tue:'Tuesday', Wed:'Wednesday', Thu:'Thursday', Fri:'Friday' };
let M = null, chart = null, line = null, dots = null, range = 10;

function draw() {
  const w = M.weekly, end = w[w.length - 1][0], from = range ? `${+end.slice(0, 4) - range}${end.slice(4)}` : '';
  if (!chart) {
    const C = A.chart();
    chart = LightweightCharts.createChart(document.getElementById('chart'), { layout:{ background:{ color:'transparent' }, textColor:C.text, fontFamily:getComputedStyle(document.body).fontFamily },
      grid:{ vertLines:{ color:C.grid }, horzLines:{ color:C.grid } }, timeScale:{ borderColor:C.border }, rightPriceScale:{ borderColor:C.border },
      autoSize:true, handleScroll:{ vertTouchDrag:false } });
    line = chart.addAreaSeries({ lineColor:C.accent, topColor:A.css('--sapphire-soft'), bottomColor:'transparent', lineWidth:2, title:'ASPI' });
    dots = chart.addLineSeries({ color:C.topaz, lineVisible:false, pointMarkersVisible:true, pointMarkersRadius:3, lastValueVisible:false, priceLineVisible:false, title:'' });
  }
  line.setData(w.filter(p => p[0] >= from).map(p => ({ time: p[0], value: p[1] })));
  const yearEnds = M.official_years.map(x => ({ time: `${x.y}-12-31`, value: x.close })).filter(p => p.time >= from && p.time <= end);
  dots.setData(yearEnds);
  chart.timeScale().fitContent();
  document.querySelectorAll('[data-r]').forEach(b => b.classList.toggle('on', +b.dataset.r === range));
}
document.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b && M) { range = +b.dataset.r; draw(); } });
addEventListener('themechange', () => { if (!M || !chart) return; chart.remove(); chart = null; draw(); });

fetch('data/market.json').then(r => r.json()).then(m => {
  M = m;
  const P = m.patterns, F = m.fit, S = m.official_summary || {}, B = m.built_from, now = P.now, ytd = m.official_ytd, C = m.checks;
  A.setStatus('Updated ' + A.when(m.made));
  const yrs = m.official_years.slice(-20);
  const fitRow = x => `<tr><td>${x.y}</td><td class="num">${sg(x.official)}</td><td class="num">${sg(x.built)}</td><td class="num ${Math.abs(x.built - x.official) > 10 ? 'warn' : 'mute'}">${(x.built - x.official > 0 ? '+' : '') + (x.built - x.official).toFixed(1)}</td></tr>`;
  const strong = P.season.filter(s => s.p != null && s.p < 0.05);
  const after = (k, label) => { const a = P.after[k]; if (!a || !a.n) return ''; const c = (h, cls = '') => a[h] ? `<td class="num${cls}">${sg(a[h].avg)} <span class="mute x">(${a[h].up} of ${a[h].n} up)</span></td>` : `<td class="num${cls}">–</td>`;
    return `<tr><td>${label} <span class="mute">${a.n} months</span></td>${c('1')}${c('3')}${c('6', ' xs')}${c('12')}</tr>`; };
  const base = P.after.down8, allRow = base && base['1'] ? `<tr><td>Any month <span class="mute">(for comparison)</span></td>${['1','3','6','12'].map(h => `<td class="num${h === '6' ? ' xs' : ''}">${sg(base[h] ? base[h].all_avg : null)} <span class="mute x">(${base[h] ? base[h].all_up_pct : '–'}% up)</span></td>`).join('')}</tr>` : '';
  const byY = Object.fromEntries(P.by_year.map(x => [x.y, x]));
  document.getElementById('main').innerHTML = `
    <p class="stamp">The All Share Price Index${ytd ? ' on ' + dmy(ytd.to) : ''}</p>
    <h1 class="headline">${num(ytd ? ytd.close : now.level)}${ytd ? ` <span style="font-size:18px;font-weight:600">${sg(ytd.ret)} <span class="mute" style="font-weight:400">this year</span></span>` : ''}</h1>
    <div class="chips">${[1, 5, 10, 20].map(y => `<button class="chip" data-r="${y}">${y} year${y > 1 ? 's' : ''}</button>`).join('')}</div>
    <div id="chart"></div>
    <div class="stats">
      <div class="stat"><b class="${S.growth_10y >= 0 ? 'up' : 'down'}">${S.growth_10y != null ? (S.growth_10y > 0 ? '+' : '') + S.growth_10y + '%' : '–'}</b><span>growth a year over the last 10 years, to end ${S.to}</span></div>
      <div class="stat"><b class="${S.growth_20y >= 0 ? 'up' : 'down'}">${S.growth_20y != null ? (S.growth_20y > 0 ? '+' : '') + S.growth_20y + '%' : '–'}</b><span>growth a year over the last 20 years</span></div>
      <div class="stat"><b>${S.up_years} <small>of</small> ${S.n_years}</b><span>years the ASPI rose</span></div>
      <div class="stat"><b>${S.best ? `<span class="up">${(S.best.ret > 0 ? '+' : '') + S.best.ret}%</span>` : '–'} <small>and</small> ${S.worst ? `<span class="down">${S.worst.ret}%</span>` : '–'}</b><span>best year (${S.best ? S.best.y : ''}) and worst (${S.worst ? S.worst.y : ''})</span></div>
    </div>
    <p class="note">Price index only: dividends are not included and nothing is adjusted for inflation.</p>
    <p class="note"><b>What the line is.</b> CSE's site only gives one year of ASPI values. From ${dmy(m.official_daily_from)} the line is the official ASPI. Before that it passes exactly through
      every official year-end close (the amber points), and between those points its shape comes from an index built here from the prices of ${B.shares_now} listed shares
      (${B.shares_at_start} at the start in ${B.start.slice(0, 4)}), each weighted by company size. So year-end levels are official; the path inside each year is an estimate.</p>

    <h2>How close is the built index to the real ASPI, before it is tied to the year-ends?</h2>
    <div class="stats" style="margin-top:0">
      <div class="stat"><b>${F.mean_gap} <small>points</small></b><span>typical gap in a year, over ${F.n} years; largest ${F.worst_gap}</span></div>
      <div class="stat"><b>${F.same_direction} <small>of</small> ${F.n}</b><span>years it moved the same way as the ASPI</span></div>
      ${F.daily ? `<div class="stat"><b>${Math.round(F.daily.corr * 100)}%</b><span>day-by-day match over the last year (ASPI ${F.daily.official > 0 ? '+' : ''}${F.daily.official}%, built ${F.daily.built > 0 ? '+' : ''}${F.daily.built}%)</span></div>` : ''}
    </div>
    <details style="margin-top:10px"><summary>Year by year: official ASPI against the built index</summary>
      <div class="tw" style="margin-top:8px"><table><tr><th>Year</th><th class="num">Official ASPI</th><th class="num">Built index</th><th class="num">Gap (points)</th></tr>${F.years.map(fitRow).join('')}</table></div></details>
    <p class="note">The built index only holds companies that are still listed today, and it cannot see new shares a company issued along the way. A year led by companies that have
      since left the exchange comes out too low, which is the likely reason for the large gap in 2021. Tying the line to the official year-ends removes these yearly gaps;
      what remains uncertain is the timing inside each year. The patterns below are measured on the tied line: a close estimate, not the official record.</p>

    <h2>Year by year <span class="mute">official ASPI</span></h2>
    <div class="tw"><table><tr><th>Year</th><th class="num">Year-end close</th><th class="num">Change</th><th class="num">Largest fall within the year</th><th class="num x">Swing (volatility)</th></tr>
      ${ytd ? `<tr><td>${ytd.y} <span class="mute">so far</span></td><td class="num">${num(ytd.close)}</td><td class="num">${sg(ytd.ret)}</td><td class="num">${byY[ytd.y] ? sg(byY[ytd.y].worst_fall) : '–'}</td><td class="num x">${byY[ytd.y] ? '±' + byY[ytd.y].vol + '%' : '–'}</td></tr>` : ''}
      ${yrs.slice().reverse().map(x => `<tr><td>${x.y}</td><td class="num">${num(x.close)}</td><td class="num">${sg(x.ret)}</td><td class="num">${byY[x.y] ? sg(byY[x.y].worst_fall) : '–'}</td><td class="num x">${byY[x.y] ? '±' + byY[x.y].vol + '%' : '–'}</td></tr>`).join('')}</table></div>
    <p class="note">Close and change are official. The fall within the year and the swing are estimates from the line above.</p>

    <h2>Month of the year <span class="mute">${P.from.slice(0, 4)} to ${P.to.slice(0, 4)}</span></h2>
    <div class="tw"><table><tr><th>Month</th><th class="num">Average</th><th class="num">Typical</th><th class="num">Rose in</th><th class="num x">Best</th><th class="num x">Worst</th></tr>
      ${P.season.map(s => `<tr class="${s.p != null && s.p < 0.05 ? 'hi' : ''}"><td>${FULL[s.m]}${now.month && now.month.m === s.m ? ' <span class="tag">now</span>' : ''}</td><td class="num">${sg(s.avg)}</td><td class="num">${sg(s.median)}</td>
        <td class="num">${s.up} of ${s.n}</td><td class="num x">${sg(s.best)}</td><td class="num x">${sg(s.worst)}</td></tr>`).join('')}</table></div>
    <ul class="points">
      ${strong.length ? strong.map(s => `<li><b>${FULL[s.m]}</b> ${s.up > s.n / 2 ? 'rose' : 'fell'} in ${s.up > s.n / 2 ? s.up : s.n - s.up} of ${s.n} years (typical month ${s.median > 0 ? '+' : ''}${s.median}%). That is more one-sided than chance usually gives for a single month.
        Twelve months were examined, and the chance of one of the twelve looking this lopsided by luck alone is about ${Math.max(1, Math.round((1 - Math.pow(1 - s.p, 12)) * 100))}%${(1 - Math.pow(1 - s.p, 12)) < 0.05
          ? `, so it is unlikely to be luck. Still, ${s.n} years is a short record: a tendency, not a rule.` : ', so it may well be luck: a tendency at most.'}</li>`).join('')
        : '<li>No month has been one-sided enough to tell apart from chance.</li>'}
      <li>For every other month the split between up and down years is what coin-tossing would give. Averages are pulled about by a few extreme months (see Best and Worst), so "Typical" (the middle year) is the better guide.</li>
      ${now.month ? `<li><b>This month and next:</b> ${FULL[now.month.m]} rose in ${now.month.up} of ${now.month.n} years (typical ${now.month.median > 0 ? '+' : ''}${now.month.median}%)${now.next_month ? `; ${FULL[now.next_month.m]} in ${now.next_month.up} of ${now.next_month.n} (typical ${now.next_month.median > 0 ? '+' : ''}${now.next_month.median}%)` : ''}.</li>` : ''}
    </ul>

    <h2>Day of the week</h2>
    <div class="tw"><table><tr><th>Day</th><th class="num">Average day</th><th class="num">Days the market rose</th><th class="num x">Days counted</th></tr>
      ${P.weekday.map(d => `<tr><td>${DAY[d.d]}</td><td class="num">${sg(d.avg, 2)}</td><td class="num">${d.up_pct}%</td><td class="num x">${num(d.n)}</td></tr>`).join('')}</table></div>
    <p class="note">Differences of a few hundredths of a per cent a day are far smaller than the cost of a trade (about 1.12% each way).</p>

    <h2>Big falls and how long they took to mend <span class="mute">falls of 20% or more</span></h2>
    <div class="tw"><table><tr><th>Peak</th><th>Low</th><th class="num">Fall</th><th class="num">Months falling</th><th class="num">Months to get back</th></tr>
      ${P.falls.map(f => `<tr><td>${my(f.peak)}</td><td>${my(f.low)}</td><td class="num">${sg(f.fall)}</td><td class="num">${f.months_down}</td><td class="num">${f.back ? f.months_back : `<span class="warn">not yet back (${f.now}%)</span>`}</td></tr>`).join('')
        || '<tr><td colspan="5" class="mute">None in this period.</td></tr>'}</table></div>
    <p class="note">Estimated from the line above, so peaks and lows inside a year can be a few per cent out and dates are given by month. A fall counts from its peak to its lowest point before the old peak is regained.</p>

    <h2>If you had bought at any month-end and held</h2>
    <div class="tw"><table><tr><th>Held for</th><th class="num">Ended higher</th><th class="num">Typical growth a year</th><th class="num">Worst</th><th class="num">Best</th><th class="num x">Starting months</th></tr>
      ${P.holding.map(h => `<tr><td>${h.years} year${h.years > 1 ? 's' : ''}</td><td class="num"><b>${h.up_pct}%</b> of the time</td><td class="num">${sg(h.median)}</td><td class="num">${sg(h.worst)}</td><td class="num">${sg(h.best)}</td><td class="num x">${h.n}</td></tr>`).join('')}</table></div>
    <p class="note">Growth is per year, price only. Add dividends and take off inflation to judge real returns.</p>

    <h2>What followed strong and weak months</h2>
    <div class="tw"><table><tr><th>After a month when the market…</th><th class="num">1 month later</th><th class="num">3 months</th><th class="num xs">6 months</th><th class="num">12 months</th></tr>
      ${after('down8', 'fell 8% or more')}${after('up8', 'rose 8% or more')}${after('dd20', 'stood 20%+ below its peak')}${after('high', 'closed at a new high')}${allRow}</table></div>
    <p class="note">Average change afterwards. The months overlap and there are few of them, so these are tendencies with wide margins, not forecasts.</p>

    <h2>Where the market stands now</h2>
    <ul class="points">
      <li>${now.from_peak < -0.5 ? `<b>${Math.abs(now.from_peak)}% below</b> its peak of ${dmy(now.peak_date)}` : '<b>At its peak</b>'}.</li>
      ${now.vs_200d != null ? `<li><b>${Math.abs(now.vs_200d)}% ${now.vs_200d >= 0 ? 'above' : 'below'}</b> its average of the last 200 trading days.</li>` : ''}
      ${now.ret_12m != null ? `<li>Over the last 12 months: <b>${sg(now.ret_12m)}</b>${now.ret_12m_rank != null ? `, better than ${now.ret_12m_rank}% of all 12-month stretches since ${P.from.slice(0, 4)}` : ''}.</li>` : ''}
    </ul>

    <h2>About the older prices</h2>
    <ul class="points">
      <li><b>Source.</b> CSE's own site gives one year of prices. Older years come from Yahoo Finance, a free and unofficial source, for ${C.with_older} of ${C.shares} counters (${C.no_older} are not there).</li>
      <li><b>Cleaned.</b> Days without trades are removed. ${C.splits_applied} listed share splits that had not been applied were applied here. ${C.assumed_splits || 0} one-step price rebasings that stayed were treated as splits the source does not list; these could not be confirmed elsewhere.</li>
      <li><b>Checked against CSE.</b> For ${C.joined} counters the older prices agree with CSE's own on the days both cover, or meet them cleanly${C.rescaled ? ` (${C.rescaled} after rescaling for a recent split)` : ''}. ${C.not_joined} did not, and keep only their CSE year.
        ${C.breaks} have an unexplained price jump somewhere in the past; their history is used only after it.</li>
      <li><b>What cannot be checked.</b> A small bonus issue the source missed looks like an ordinary fall and would understate a share's older returns. Each share's page lists the checks made on its own history.</li>
    </ul>
    <p class="note" style="margin-top:16px">Past patterns do not predict the future. Nothing on this site is financial advice.</p>`;
  draw();
}).catch(() => { document.getElementById('main').innerHTML = '<p class="mute">Market history is not available yet. It is built with the daily update.</p>'; });
</script>
</body>
</html>
